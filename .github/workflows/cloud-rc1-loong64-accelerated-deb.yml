          test "$rc" -eq 0 -o "$rc" -eq 2
          python - "$out/release-signature-status.txt" <<'PY'
          import pathlib, sys
          lines = [line.split() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith("[GNUPG:] ")]
          trusted = "AD671F061CAFB9B639F1B139F5575F0BCD17A2D3"
          assert any(len(x) >= 11 and x[1] == "VALIDSIG" and x[2] == trusted and x[9] in {"8", "9", "10"} for x in lines), "PINNED_DEEPIN_SIGNATURE_MISSING_OR_WEAK"
          assert not any(x[1] in {"BADSIG", "EXPSIG", "EXPKEYSIG", "REVKEYSIG", "KEYEXPIRED", "SIGEXPIRED", "NODATA", "FAILURE"} for x in lines), "RELEASE_SIGNATURE_INVALID"
          print("EXACT_PINNED_DEEPIN_SIGNATURE_PASS")
          PY
          test -s "$out/Release"
          grep -Eq '^Architectures:.*\bloong64\b' "$out/Release"
          sha256sum "$out/crimson.gpg" "$out/InRelease" > "$out/archive-input-sha256.txt"
      - name: Bootstrap signed Deepin Crimson loong64 sysroot without disabling apt verification
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deepin-loong64"
          out="$PWD/artifacts/loong64-deepin-baseline"
          key="$out/crimson.gpg"
          sudo "$PARTYOPS_MMDEBSTRAP" --mode=root --architectures=loong64 --variant=minbase --keyring="$key" --include=ca-certificates,deepin-keyring,python3,build-essential,binutils '' "$root" "deb [signed-by=$key] $DEEPIN_REPO crimson main" 2>&1 | tee "$out/bootstrap.log"
          sudo install -m 0755 /usr/bin/qemu-loongarch64-static "$root/usr/bin/qemu-loongarch64-static"
          sudo install -D -m 0644 "$key" "$root/usr/share/keyrings/partyops-deepin-crimson-pinned.gpg"
          printf 'deb [signed-by=/usr/share/keyrings/partyops-deepin-crimson-pinned.gpg] %s crimson main\n' "$DEEPIN_REPO" | sudo tee "$root/etc/apt/sources.list"
          sudo chroot "$root" dpkg --print-architecture | tee "$out/architecture.txt"
          test "$(cat "$out/architecture.txt")" = loong64
          sudo chroot "$root" getconf GNU_LIBC_VERSION | tee "$out/glibc.txt"
          test "$(cat "$out/glibc.txt")" = 'glibc 2.38'
          sudo chroot "$root" cat /etc/os-release | tee "$out/os-release.txt"
          sudo chroot "$root" python3 -c 'import platform,ssl,sqlite3; assert platform.machine() in ("loongarch64","loong64"); print(platform.python_version(),ssl.OPENSSL_VERSION,sqlite3.sqlite_version)' | tee "$out/native-python.txt"
          sudo chroot "$root" apt-get update
          sudo chroot "$root" apt-cache policy libc6 libc6-dev python3 python3.12 python3.12-dev python3-tk python3-pip python3-venv gcc rustc cargo python3-numpy python3-pyinstaller python3-pymupdf python3-cryptography python3-pydantic python3-calamine libmupdf-dev tesseract-ocr | tee "$out/native-package-availability.txt"
          sudo chroot "$root" dpkg-query -W > "$out/installed-packages.tsv"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-driver
          persist-credentials: false
      - name: Audit historical exact RC6 Loong64 donor and non-app native payload before freeze completes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          out="$PWD/artifacts/loong64-deepin-baseline"
          donor=PartyOps_1.4.5-rc.6_linux_loong64.deb
          gh release download v1.4.5-rc.6 --repo "$GITHUB_REPOSITORY" --pattern "$donor" --dir "$RUNNER_TEMP"
          printf '%s  %s\n' bec5993a12a9a66800fa039045f45329ecc486934cd1d1106c10d5e2ecf78017 "$RUNNER_TEMP/$donor" | sha256sum -c -
          python qa-driver/scripts/rc1_loong64_stage_deb.py audit "$RUNNER_TEMP/$donor" "$RUNNER_TEMP/loong-package-stage" "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC1-Loong64-verified-historical-native-donor-audit-${{ env.SOURCE_SHA }}
          path: artifacts/loong64-deepin-baseline/donor-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Fetch immutable successful freeze from this exact workflow run
        shell: bash
        run: |
          set -euo pipefail
          name="RC1-Loong64-accelerated-frozen-APP-$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq -e --arg name "$name" '[.artifacts[]|select(.name==$name and (.expired|not))] | if length==1 then .[0] else error("artifact not unique") end' > "$RUNNER_TEMP/freeze-artifact.json"
          id="$(jq -r .id "$RUNNER_TEMP/freeze-artifact.json")"
          digest="$(jq -r .digest "$RUNNER_TEMP/freeze-artifact.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/freeze.zip"
          printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/freeze.zip" | sha256sum -c -
          python qa-driver/scripts/rc1_loong64_stage_deb.py stage "$RUNNER_TEMP/freeze.zip" "$RUNNER_TEMP/loong-package-stage" "$PWD/artifacts/loong64-deepin-baseline"
      - name: Exercise full staged package in signed Deepin QEMU root before sealing
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deepin-loong64"
          out="$PWD/artifacts/loong64-deepin-baseline"
          sudo chroot "$root" apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libx11-6 libxext6 libxrender1 libfontconfig1 libfreetype6 libnss3 libdbus-1-3 libgl1 libxinerama1 libxrandr2 libxfixes3 libcups2 libsm6 libice6 libopenblas0 libgfortran5
          sudo mkdir -p "$root/opt" "$root/tmp/partyops-pkg-selftest"
          sudo cp -a "$RUNNER_TEMP/loong-package-stage/opt/partyops" "$root/opt/"
          sudo chown 65534:65534 "$root/tmp/partyops-pkg-selftest"
          sudo unshare --mount --net --pid --fork /bin/bash -c 'set -e; root="$1"; shift; mount --make-rprivate /; mount -t proc -o nosuid,nodev,noexec proc "$root/proc"; exec chroot --userspec=65534:65534 "$root" "$@"' _ "$root" /usr/bin/env -i HOME=/tmp/partyops-pkg-selftest PATH=/usr/bin:/bin LANG=C.UTF-8 PARTYOPS_DATA_DIR=/tmp/partyops-pkg-selftest PARTYOPS_ENVIRONMENT=production PARTYOPS_STRICT_SQLITE=true PARTYOPS_SEED_DEMO=false /usr/bin/xvfb-run -a /opt/partyops/partyops --package-self-test 2>&1 | tee "$out/full-package-selftest.log"
          printf 'PASS\n' > "$out/full-package-selftest.status"
      - name: Seal unsigned candidate DEB only after full emulated runtime gate
        shell: bash
        run: |
          set -euo pipefail
          python qa-driver/scripts/rc1_loong64_stage_deb.py seal "$RUNNER_TEMP/loong-package-stage" "$PWD/artifacts/loong64-deepin-baseline"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RC1-Loong64-accelerated-UNSIGNED-DEB-CANDIDATE-${{ env.SOURCE_SHA }}
          path: artifacts/loong64-deepin-baseline
          if-no-files-found: warn
          retention-days: 14
