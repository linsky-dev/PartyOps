name: RC1 Windows installer prerequisite audit (NO INSTALLER)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-windows-rc1-packaging-readiness.yml'
      - 'scripts/rc1_windows_packaging_readiness.py'
      - 'backend/tests/test_rc1_windows_packaging_readiness.py'
      - 'scripts/rc1_release_security.py'
      - 'scripts/verify-full-function-gate.py'
      - 'backend/uv.lock'
      - 'backend/pyproject.toml'
      - 'backend/requirements.txt'
      - 'backend/legacy/**'
      - 'packaging/windows/**'
      - '.release-gates/**'

permissions:
  contents: read

concurrency:
  group: windows-rc1-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-package-inputs:
    name: Audit Windows x64 + Win7 inputs without building installers
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64

      - name: Run diagnostic-only fail-closed contracts
        shell: pwsh
        run: |
          python -m unittest discover -s backend/tests -p test_rc1_windows_packaging_readiness.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recover and verify official pinned Windows x64 SQLite from existing build script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = (python -c 'import sys; print(sys.executable)').Trim()
          & pwsh -NoProfile -File scripts/prepare-windows-build.ps1 -Python $pythonExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = 'vendor/windows/sqlite-3.53.4/runtime/sqlite3.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw '[WINDOWS_SQLITE_SOURCE_MISSING] Pinned SQLite preparation produced no DLL.'
          }
          $sha = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'ab57d0437795ecc757cb693f32ea224173fa9856594d95cfa6b5033e645cd1ec') {
            throw '[WINDOWS_SQLITE_DIGEST_MISMATCH] Refuse unverifiable runtime.'
          }
          $evidence = [ordered]@{
            source_commit = '${{ github.sha }}'
            target = 'windows-10-11-amd64'
            input = 'sqlite-3.53.4'
            runtime_sha256 = $sha
            verification = 'PASS_VERIFIED_OFFICIAL_ARCHIVE_SHA3_DLL_SHA256_AND_NATIVE_DLL_VERSION'
            signed_installer = $false
            installer_generated = $false
            release_ready = $false
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $evidence | ConvertTo-Json | Out-File -LiteralPath artifacts/windows-rc1-sqlite.json -Encoding utf8

      - name: Recover and verify official .NET Framework 4.8 offline prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./packaging/windows/prepare-dotnet48-runtime.ps1
          $repoRoot = (Get-Location).Path
          $dest = Join-Path $repoRoot 'artifacts/verified-dotnet48/prerequisites'
          Add-VerifiedPartyOpsDotNet48Prerequisite -RepoRoot $repoRoot -Destination $dest
          $source = Get-Content -LiteralPath vendor/windows/dotnet-framework-4.8/SOURCE.json -Raw | ConvertFrom-Json
          $file = Join-Path $dest 'ndp48-x86-x64-allos-enu.exe'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
            throw '[DOTNET48_RUNTIME_VERIFIED_FILE_MISSING]'
          }
          $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '0a3a390c47e639d0f7fc65b21195fee6b7f65b066f80f70c60fab191d14b7e40') {
            throw '[DOTNET48_RUNTIME_VERIFIED_SHA256_MISMATCH]'
          }
          [ordered]@{
            source_commit = '${{ github.sha }}'
            component = 'dotnet-framework-4.8-prerequisite'
            official_sha256 = $sha
            official_license_basis = $source.redistribution_basis
            signature_subject = $source.authenticode.subject
            signature_thumbprint = $source.authenticode.certificate_thumbprint
            verified_by_original_partyops_build_script = $true
            installer_generated = $false
            release_ready = $false
          } | ConvertTo-Json | Out-File -LiteralPath artifacts/windows-rc1-dotnet48.json -Encoding utf8

      - name: Report actual clean-checkout Windows package requirements
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/rc1_windows_packaging_readiness.py --root . --output artifacts/windows-rc1-preflight.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath artifacts/windows-rc1-preflight.json -Raw | ConvertFrom-Json
          if ($result.status -ne 'BLOCKED' -or $result.release_ready -or $result.installer_generated) {
            throw '[WINDOWS_PREFLIGHT_FALSE_READY] Diagnostic may not claim an installer.'
          }
          @(
            '### PartyOps Windows RC1 source-only packaging diagnostic',
            "Source: ${{ github.sha }}",
            'No installer built, no signature or real WPS acceptance claimed.',
            "Release status: $($result.status)",
            "Missing or unresolved checks: $($result.blockers.Count)",
            'The JSON artifact lists the exact inputs and next manual/native checks.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows preflight JSON, not an installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partyops-rc1-windows-packaging-readiness-${{ github.sha }}
          path: |
            artifacts/windows-rc1-preflight.json
            artifacts/windows-rc1-sqlite.json
            artifacts/windows-rc1-dotnet48.json
          if-no-files-found: warn
          retention-days: 14
