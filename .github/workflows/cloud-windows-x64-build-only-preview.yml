name: RC1 Windows x64 safe-PDF unsigned EXE (BUILD_ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-windows-x64-build-only-preview.yml'
      - 'packaging/windows/build-windows.ps1'
      - 'scripts/rc1_windows_historical_wps_reference.py'
      - 'backend/tests/test_rc1_windows_build_only_preview.py'
      - 'backend/tests/test_rc1_windows_historical_wps_reference.py'
permissions:
  contents: read
concurrency:
  group: partyops-windows-buildonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-preview:
    name: Actual Inno installer with isolated PyMuPDF 2.1 (unsigned)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout exact source, never production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check build-only contracts and true prior WPS receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'uv==0.11.7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q backend/tests/test_rc1_windows_build_only_preview.py backend/tests/test_rc1_windows_historical_wps_reference.py backend/tests/test_rc1_windows_secure_pdf_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python scripts/rc1_windows_historical_wps_reference.py --root . --output artifacts/rc1-preview-historical-wps-reference.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-version-consistency.py --root . --expected 1.4.6-rc.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'RC1_PREVIOUS_WPS_HISTORICAL_REFERENCE_VALIDATED_NOT_NATIVE_APPROVAL'
      - name: Resolve isolated exact PyMuPDF 2.1 without touching production lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'artifacts/windows-build-only-pdf/backend'
          python scripts/rc1_windows_pdf_lock_review.py prepare --root . --candidate $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv lock --project $project --upgrade-package pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_windows_pdf_lock_delta.py --baseline backend/uv.lock --candidate "$project/uv.lock" --output artifacts/windows-build-only-pdf/lock-delta.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_pymupdf_21_wheel_matrix.py --lock "$project/uv.lock" --output artifacts/windows-build-only-pdf/wheel-matrix.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project $project --locked --no-install-project --group dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pdfPython = (Resolve-Path -LiteralPath "$project/.venv/Scripts/python.exe").Path
          uv pip install --python $pdfPython 'pip==25.3' -r packaging/windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pdfPython -c "import importlib.metadata; assert importlib.metadata.version('PyMuPDF') == '2.1'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_windows_secure_pdf_package.py --root artifacts/windows-build-only-pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_windows_pdf_lock_review.py finalize --root . --candidate $project --evidence artifacts/windows-build-only-pdf/provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download byte-verified official runtime inputs and RC6 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'partyops-rc1-preview-inputs'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $assets = @(
            @{file='LibreOffice_26.2.7_Win_x86-64.msi'; url='https://download.documentfoundation.org/libreoffice/stable/26.2.7/win/x86_64/LibreOffice_26.2.7_Win_x86-64.msi'; sha='480fecf759fc6393bd614fbf43753eb95a8198fc1a065d41b727e3b664cd1e59'},
            @{file='PartyOps_1.4.5-rc.6_windows_amd64_startup-20261018.exe'; url='https://github.com/linsky-dev/PartyOps/releases/download/v1.4.5-rc.6/PartyOps_1.4.5-rc.6_windows_amd64_startup-20261018.exe'; sha='e3e2ea45ccd38acff059b5713826a78f998a56ccef75341633f67bd4e17e57da'},
            @{file='release-manifest-windows-startup-20261018.json'; url='https://github.com/linsky-dev/PartyOps/releases/download/v1.4.5-rc.6/release-manifest-windows-startup-20261018.json'; sha='9e314cbfa1c5d604ad0f24dd8525b0afcda4f511f1cd8d4571114be1061298ee'},
            @{file='innoextract670.zip'; url='https://github.com/UserUnknownFactor/innoextract_win/releases/download/670/innoextract670.zip'; sha='79b69b9b1fcd98f42ccd4b245efdf6a03bcfb674ba6af482f5a46891c9ed4d14'}
          )
          foreach ($item in $assets) {
            $dest = Join-Path $work $item.file
            & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 45 --max-time 1800 --output $dest $item.url
            if ($LASTEXITCODE -ne 0) { throw "[RC1_PREVIEW_DOWNLOAD_FAILED] $($item.file)" }
            if ((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.sha) {
              throw "[RC1_PREVIEW_SOURCE_HASH_MISMATCH] $($item.file)"
            }
          }
          if ((Get-Item -LiteralPath (Join-Path $work $assets[1].file)).Length -ne 449988807) {
            throw '[RC1_PREVIEW_RC6_SIZE_INVALID]'
          }
          $unpacked = Join-Path $work 'extractor-unpacked'
          Expand-Archive -LiteralPath (Join-Path $work 'innoextract670.zip') -DestinationPath $unpacked
          $trusted = Join-Path $work 'extractor'
          New-Item -ItemType Directory -Path $trusted -Force | Out-Null
          $hashes = @{
            'innoextract.exe'='0dab51583e403970065db49f87a6a2bf683ab6ebfdf27bede2bf633dd232a1a2'
            'libbz2-1.dll'='b79cd3a7102e359ef6324e98966a67939e58ec2b651ae2847cae84a4dfa453f7'
          }
          foreach ($name in $hashes.Keys) {
            $files = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter $name)
            if ($files.Count -ne 1) { throw "[RC1_PREVIEW_EXTRACTOR_AMBIGUOUS] $name" }
            Copy-Item -LiteralPath $files[0].FullName -Destination (Join-Path $trusted $name)
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $trusted $name)).Hash.ToLowerInvariant() -ne $hashes[$name]) {
              throw "[RC1_PREVIEW_EXTRACTOR_HASH_INVALID] $name"
            }
          }
      - name: Stage official DLLs, OCR, AI and LibreOffice via original verified preparers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'partyops-rc1-preview-inputs'
          $args = @{
            RepoRoot = (Get-Location).Path
            LibreOfficeMsi = (Join-Path $work 'LibreOffice_26.2.7_Win_x86-64.msi')
            Rc6Installer = (Join-Path $work 'PartyOps_1.4.5-rc.6_windows_amd64_startup-20261018.exe')
            Rc6ReleaseMetadata = (Join-Path $work 'release-manifest-windows-startup-20261018.json')
            InnoExtractorDirectory = (Join-Path $work 'extractor')
            Python = (python -c 'import sys; print(sys.executable)').Trim()
          }
          & ./scripts/stage-rc1-windows-x64-verified-inputs.ps1 @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = Get-Content -LiteralPath artifacts/windows-x64-input-closure-evidence.json -Raw | ConvertFrom-Json
          if ($record.release_ready -or $record.installer_built) {
            throw '[RC1_PREVIEW_INPUT_STAGE_FALSE_READY]'
          }
      - name: Find or install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe')
          )
          $found = @($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if (-not $found.Count) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw '[RC1_PREVIEW_INNO_INSTALL_FAILED]' }
            $found = @($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          }
          if (-not $found.Count) { throw '[RC1_PREVIEW_INNO_MISSING]' }
          "PARTYOPS_PREVIEW_INNO_COMPILER=$($found[0])" >> $env:GITHUB_ENV
      - name: Build actual PyInstaller + Inno unsigned EXE (not a release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $safeRoot = (Resolve-Path -LiteralPath artifacts/windows-build-only-pdf).Path
          $safePython = (Resolve-Path -LiteralPath "$safeRoot/backend/.venv/Scripts/python.exe").Path
          $args = @{
            Python = $safePython
            PdfCandidateRoot = $safeRoot
            InnoCompiler = $env:PARTYOPS_PREVIEW_INNO_COMPILER
            BuildOnlyPreview = $true
          }
          & ./packaging/windows/build-windows.ps1 @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove exact EXE hash, PE header and mandatory nonrelease labels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'artifacts/PartyOps_1.4.6-rc.1_windows_amd64_BUILD_ONLY_UNVERIFIED'
          $exe = "$base.exe"
          $receipt = "$base.candidate.json"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf) -or
              -not (Test-Path -LiteralPath $receipt -PathType Leaf)) {
            throw '[RC1_PREVIEW_EXE_OR_RECEIPT_MISSING]'
          }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $exe).Path)
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw '[RC1_PREVIEW_NOT_A_PE_INSTALLER]'
          }
          $data = Get-Content -Raw -LiteralPath $receipt | ConvertFrom-Json
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($data.scope -ne 'BUILD_ONLY_UNVERIFIED_NATIVE_WPS' -or
              $data.signed -or $data.release_ready -or
              $data.current_version_native_wps_tested -or $data.full_function_gate_passed -or
              $data.embedded_pymupdf -ne '2.1' -or $data.sha256 -ne $hash -or
              -not $data.historical_wps_reference_sha256) {
            throw '[RC1_PREVIEW_FALSE_RELEASE_RECEIPT]'
          }
          if (Test-Path -LiteralPath artifacts/PartyOps_1.4.6-rc.1_windows_amd64.exe) {
            throw '[RC1_PREVIEW_OFFICIAL_FILENAME_MUST_NOT_EXIST]'
          }
          @(
            '### Actual PartyOps 1.4.6-rc.1 Windows x64 unsigned internal EXE built',
            "SHA-256: $hash",
            'PyMuPDF 2.1 isolated, other production dependencies unchanged',
            'Previous WPS evidence: HISTORICAL REFERENCE ONLY',
            'Current native WPS, sign, install/upgrade/rollback, publication: NOT_RUN',
            'BUILD_ONLY_UNVERIFIED_NATIVE_WPS. DO NOT PUBLISH.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload unsigned EXE only for dedicated QA, plus truthful metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partyops-windows-x64-BUILD_ONLY-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/PartyOps_1.4.6-rc.1_windows_amd64_BUILD_ONLY_UNVERIFIED.exe
            artifacts/PartyOps_1.4.6-rc.1_windows_amd64_BUILD_ONLY_UNVERIFIED.exe.sha256
            artifacts/PartyOps_1.4.6-rc.1_windows_amd64_BUILD_ONLY_UNVERIFIED.candidate.json
            artifacts/windows-build-only-pdf/provenance.json
            artifacts/windows-build-only-pdf/lock-delta.json
            artifacts/windows-build-only-pdf/wheel-matrix.json
            artifacts/rc1-preview-historical-wps-reference.json
            artifacts/windows-x64-input-closure-evidence.json
          if-no-files-found: warn
          retention-days: 14
