name: RC1 Windows 11 ARM64 actual installed native launcher and uninstall (HOSTED_ONLY)
on:
  pull_request:
    branches: [qa/rc1-arm64-full-pdf-inputs-20261124]
    paths:
      - '.github/workflows/cloud-rc1-arm64-hosted-install.yml'
      - 'scripts/rc1-windows-arm64-converged-smoke.ps1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: bada0183e84f14fce2a24ca281a60d9f7defe2e5
      PACKAGE_RUN: '45634021387'
      ARTIFACT_ID: '15037195478'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download exact successful ARM64 installer archive and verify GitHub digest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne '6d24dbca738280d5bc873a922c74591141bb7fb4' -or $run.status -ne 'completed' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.path -ne '.github/workflows/cloud-rc1-arm64-converged-install.yml') { throw 'ARM64_PACKAGE_RUN_INVALID' }
          # A failed later smoke is not an invalid built EXE. Require completed
          # upstream freeze and the actual EXE build/upload steps to have passed.
          $jobs=(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN/jobs?per_page=100" | ConvertFrom-Json).jobs
          if ($LASTEXITCODE -ne 0 -or -not @($jobs | Where-Object { $_.name -like 'Exact full PDF*' -and $_.conclusion -eq 'success' }).Count) { throw 'ARM64_UPSTREAM_FREEZE_NOT_PASSED' }
          $build=@($jobs | Where-Object { $_.name -eq 'package' })
          if ($build.Count -ne 1 -or -not @($build[0].steps | Where-Object { $_.name -eq 'Install exact same-run candidate and exercise native runtime, launcher and uninstall' -and $_.conclusion -eq 'failure' }).Count) { throw 'ARM64_EXPECTED_SMOKE_ONLY_FAILURE_MISSING' }
          $prior=@($build[0].steps | Where-Object { $_.number -lt (@($build[0].steps | Where-Object { $_.name -eq 'Install exact same-run candidate and exercise native runtime, launcher and uninstall' })[0].number) -and $_.conclusion -ne 'success' })
          if ($prior.Count) { throw 'ARM64_EARLIER_BUILD_STEP_FAILED' }
          $a=gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $a.expired -or $a.workflow_run.id -ne [long]$env:PACKAGE_RUN -or $a.name -ne "RC1-Windows11-ARM64-UNSIGNED-EXE-BUILD-ONLY-$env:SOURCE" -or $a.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'ARM64_ARTIFACT_IDENTITY_INVALID' }
          $zip=Join-Path $env:RUNNER_TEMP 'arm64-verified.zip'
          # gh writes binary via cmd redirection; never send ZIP through PS object pipeline.
          cmd /d /c "gh api repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip > `"$zip`""
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip).Hash.ToLowerInvariant() -ne $a.digest.Substring(7)) { throw 'ARM64_ARTIFACT_DIGEST_INVALID' }
          $dest=Join-Path $env:RUNNER_TEMP 'arm64-candidate'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $exe=@(Get-ChildItem -LiteralPath $dest -Recurse -File -Filter 'PartyOps_1.4.6-rc.1_windows11_arm64_BUILD_ONLY_UNVERIFIED.exe')
          if ($exe.Count -ne 1) { throw 'ARM64_INSTALLER_FILE_IDENTITY' }
          $receipt=Get-Content -LiteralPath ($exe[0].FullName+'.candidate.json') -Raw | ConvertFrom-Json
          $hash=(Get-FileHash $exe[0].FullName).Hash.ToLowerInvariant()
          if ($receipt.source_commit -ne $env:SOURCE -or $receipt.architecture -ne 'arm64' -or $receipt.release_ready -or $receipt.native_install_tested -or $receipt.sha256 -ne $hash -or $receipt.status -ne 'WINDOWS11_ARM64_UNSIGNED_EXE_BUILD_ONLY') { throw 'ARM64_CANDIDATE_RECEIPT_INVALID' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QA_INSTALLER=$($exe[0].FullName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QA_SHA=$hash"
      - name: Actual native Windows 11 ARM64 clean install, startup, launcher and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $e=$null; $t=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/rc1-windows-arm64-converged-smoke.ps1'),[ref]$t,[ref]$e) | Out-Null
          if ($e.Count) { throw ($e | Out-String) }
          & scripts/rc1-windows-arm64-converged-smoke.ps1 -Installer $env:QA_INSTALLER -ExpectedSha256 $env:QA_SHA -OutputDirectory "$env:RUNNER_TEMP/arm64-install-evidence" -ConfirmEphemeralHostedRunner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RC1-Windows11-ARM64-HOSTED-ACTUAL-INSTALL-EVIDENCE-${{ env.SOURCE }}
          path: ${{ runner.temp }}/arm64-install-evidence
          if-no-files-found: warn
          retention-days: 14
