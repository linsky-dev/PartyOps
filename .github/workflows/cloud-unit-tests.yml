name: Cloud unit tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloud-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Linux backend regressions and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check available disk space
        shell: bash
        run: |
          set -euo pipefail
          available_bytes="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          printf 'Available bytes after checkout: %s\n' "$available_bytes"
          test "$available_bytes" -ge $((4 * 1024 * 1024 * 1024))

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/uv.lock
            qa/vm-lab/requirements.txt

      - name: Install locked backend and test dependencies
        id: backend-deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.11.7'
          uv sync --project backend --frozen --group dev
          uv pip install --python backend/.venv/bin/python \
            'pytest==9.1.1' 'pytest-cov==6.2.1' 'pytest-asyncio==1.4.0' \
            'ruff==0.16.4' 'pip-audit==2.10.1' 'bandit==1.9.4' \
            -r qa/vm-lab/requirements.txt
          mkdir -p artifacts/backend

      - name: Run portable backend regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend
          cd backend
          .venv/bin/pytest tests/test_auth_hardening.py tests/test_rc1_account_recovery.py \
            tests/test_rc1_recovery_cli.py \
            tests/test_rc1_agent_identity.py tests/test_z_recovery_and_events.py tests/test_enrollment_codes.py \
            tests/test_rc1_transport_enrollment_boundaries.py \
            tests/test_146_notification_target_resilience.py tests/test_146_workspace_context.py \
            tests/test_rc1_workspace_context_access.py \
            tests/test_146_development_tracks.py tests/test_party_development.py \
            tests/test_rc1_dual_development_reminders.py \
            tests/test_rc1_arm64_crypto_source_contract.py \
            tests/test_rc1_release_target_contract.py tests/test_rc1_release_gate_fail_closed.py \
            tests/test_rc1_arm64_runtime_wheel_audit.py \
            tests/test_rc1_onnx_arm64_candidate_contract.py \
            tests/test_rc1_real_bge_arm64_contract.py \
            tests/test_rc1_arm64_pdf_lite_contract.py \
            tests/test_document_formatter_source_snapshot.py \
            tests/test_160_rc4_upgrade_startup.py tests/test_version_consistency_gate.py \
            --junitxml=../artifacts/backend/junit.xml \
            2>&1 | tee ../artifacts/backend/pytest.log

      - name: Run Python dependency audit
        if: ${{ !cancelled() && steps.backend-deps.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv export --project backend --frozen --no-dev --no-emit-project --no-hashes \
            --output-file artifacts/backend/locked-runtime.txt --quiet
          backend/.venv/bin/pip-audit --no-deps --disable-pip -r artifacts/backend/locked-runtime.txt \
            --format json --output artifacts/backend/pip-audit.json

      - name: Run Python static checks
        if: ${{ !cancelled() && steps.backend-deps.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          backend/.venv/bin/bandit -r backend/app -f json -ll \
            -o artifacts/backend/bandit.json
          backend/.venv/bin/ruff check backend/app backend/tests

      - name: Upload backend test and security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-evidence-${{ github.sha }}
          path: artifacts/backend
          if-no-files-found: warn
          retention-days: 14

  windows-native:
    name: Windows full backend suite and coverage
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Fetch and verify the pinned .NET Framework test input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $available = (Get-Item -LiteralPath $root).PSDrive.Free
          if ($available -lt 4GB) { throw 'Windows runner has less than 4 GiB available.' }
          . ./packaging/windows/prepare-dotnet48-runtime.ps1
          Add-VerifiedPartyOpsDotNet48Prerequisite -RepoRoot $root `
            -Destination (Join-Path $root 'artifacts/windows-dotnet48-input')

      - name: Run the full backend suite with native Windows interfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check 'uv==0.11.7'
          uv sync --project backend --frozen --group dev
          uv pip install --python backend/.venv/Scripts/python.exe -r backend/requirements-dev.txt -r qa/vm-lab/requirements.txt -r packaging/windows/requirements-build.txt
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          Push-Location backend
          try {
            .venv/Scripts/python.exe -m mypy app --no-incremental 2>&1 | Tee-Object -FilePath ../artifacts/windows/mypy.log
            .venv/Scripts/python.exe -m pytest tests -rs --cov=app --cov-branch --cov-report=json:../artifacts/windows/coverage.json --junitxml=../artifacts/windows/junit.xml 2>&1 | Tee-Object -FilePath ../artifacts/windows/pytest.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Check the existing backend release coverage thresholds
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/verify-coverage.py artifacts/windows/coverage.json --line 95 --branch 92

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-evidence-${{ github.sha }}
          path: artifacts/windows
          if-no-files-found: warn
          retention-days: 14

  windows-formatter-source:
    name: Windows formatter upstream (${{ matrix.architecture }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86, AnyCPU]
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python for source verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Rebuild the verified upstream and run the bundled regressions
        shell: pwsh
        env:
          FORMATTER_ARCH: ${{ matrix.architecture }}
          PYTHONUTF8: '1'
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $available = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).PSDrive.Free
          if ($available -lt 4GB) { throw 'Windows runner has less than 4 GiB available.' }
          $evidence = 'artifacts/formatter-source'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $source = Join-Path $env:RUNNER_TEMP 'formatter-upstream'
          python scripts/verify-document-formatter-source-snapshot.py `
            --source vendor/document-formatter-source --stage-upstream $source |
            Tee-Object -FilePath "$evidence/source-snapshot.json"
          & (Join-Path $source 'tools/Build-Windows.ps1') -Configuration Release -Platform $env:FORMATTER_ARCH 2>&1 |
            Tee-Object -FilePath "$evidence/build-and-regression.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-document-formatter-host.ps1 -Platform $env:FORMATTER_ARCH `
            -DocumentFormatterSource $source -StageDirectory "$evidence/host" 2>&1 |
            Tee-Object -FilePath "$evidence/relocated-host-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload formatter source build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatter-source-${{ matrix.architecture }}-${{ github.sha }}
          path: artifacts/formatter-source
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install pnpm
        id: pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare 'pnpm@11.9.0' --activate
          printf 'store=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Check available disk space
        shell: bash
        run: |
          set -euo pipefail
          available_bytes="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          printf 'Available bytes after checkout: %s\n' "$available_bytes"
          test "$available_bytes" -ge $((4 * 1024 * 1024 * 1024))

      - name: Install frozen frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend, tests, coverage, and production build
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/frontend
          pnpm run typecheck 2>&1 | tee ../artifacts/frontend/typecheck.log
          pnpm run test:coverage 2>&1 | tee ../artifacts/frontend/coverage.log
          pnpm run build 2>&1 | tee ../artifacts/frontend/build.log
          pnpm run test:sites 2>&1 | tee ../artifacts/frontend/sites.log
          pnpm audit --prod --json > ../artifacts/frontend/npm-audit.json

      - name: Upload frontend test and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-evidence-${{ github.sha }}
          path: artifacts/frontend
          if-no-files-found: warn
          retention-days: 14
