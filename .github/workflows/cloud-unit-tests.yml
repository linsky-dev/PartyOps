name: Cloud unit tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloud-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check available disk space
        shell: bash
        run: |
          set -euo pipefail
          available_bytes="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          printf 'Available bytes after checkout: %s\n' "$available_bytes"
          test "$available_bytes" -ge $((4 * 1024 * 1024 * 1024))

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/uv.lock
            qa/vm-lab/requirements.txt

      - name: Install locked backend and test dependencies
        id: backend-deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.11.7'
          uv sync --project backend --frozen --group dev
          uv pip install --python backend/.venv/bin/python \
            'pytest==9.1.1' 'pytest-cov==6.2.1' 'pytest-asyncio==1.4.0' \
            'ruff==0.16.4' 'pip-audit==2.10.1' 'bandit==1.9.4' \
            -r qa/vm-lab/requirements.txt
          mkdir -p artifacts/backend

      - name: Run backend tests and coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend
          cd backend
          .venv/bin/pytest tests --cov=app --cov-branch \
            --cov-report=term-missing --cov-report=json:../artifacts/backend/coverage.json \
            2>&1 | tee ../artifacts/backend/pytest.log
          cd ..
          python scripts/verify-coverage.py artifacts/backend/coverage.json

      - name: Run Python dependency audit
        if: ${{ !cancelled() && steps.backend-deps.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          backend/.venv/bin/pip-audit -r backend/requirements.txt \
            --format json --output artifacts/backend/pip-audit.json

      - name: Run Python static checks
        if: ${{ !cancelled() && steps.backend-deps.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          backend/.venv/bin/bandit -r backend/app -f json -ll \
            -o artifacts/backend/bandit.json
          backend/.venv/bin/ruff check backend/app backend/tests

      - name: Upload backend test and security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-evidence-${{ github.sha }}
          path: artifacts/backend
          if-no-files-found: warn
          retention-days: 14

  windows-native:
    name: Windows account and startup checks
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run Windows startup and account regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'uv==0.11.7'
          uv sync --project backend --frozen --group dev
          uv pip install --python backend/.venv/Scripts/python.exe -r backend/requirements-dev.txt -r qa/vm-lab/requirements.txt
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          Push-Location backend
          try {
            .venv/Scripts/python.exe -m pytest tests/test_setup_wizard_rc3_branch_matrix.py tests/test_rc1_account_recovery.py tests/test_rc1_agent_identity.py tests/test_160_rc4_upgrade_startup.py --junitxml=../artifacts/windows/junit.xml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-evidence-${{ github.sha }}
          path: artifacts/windows
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install pnpm
        id: pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare 'pnpm@11.9.0' --activate
          printf 'store=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Check available disk space
        shell: bash
        run: |
          set -euo pipefail
          available_bytes="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          printf 'Available bytes after checkout: %s\n' "$available_bytes"
          test "$available_bytes" -ge $((4 * 1024 * 1024 * 1024))

      - name: Install frozen frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend, tests, coverage, and production build
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/frontend
          pnpm run typecheck 2>&1 | tee ../artifacts/frontend/typecheck.log
          pnpm run test:coverage 2>&1 | tee ../artifacts/frontend/coverage.log
          pnpm run test:sites 2>&1 | tee ../artifacts/frontend/sites.log
          pnpm run build 2>&1 | tee ../artifacts/frontend/build.log
          pnpm audit --prod --json > ../artifacts/frontend/npm-audit.json

      - name: Upload frontend test and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-evidence-${{ github.sha }}
          path: artifacts/frontend
          if-no-files-found: warn
          retention-days: 14
