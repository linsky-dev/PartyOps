name: RC1 Windows installer path original runtime probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-windows-installer-path-probe.yml'
      - 'packaging/windows/validate-install-path.ps1'
      - 'backend/tests/test_rc1_windows_install_path.py'

permissions:
  contents: read

jobs:
  drive-classification:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exercise real Windows PowerShell 5.1 local and invalid drive paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path (Get-Location) 'packaging/windows/validate-install-path.ps1'
          $ps5 = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $disk = [IO.DriveInfo]::new('C:\')
          Write-Host "REAL_C_DRIVE_TYPE=$($disk.DriveType)"
          if ($disk.DriveType -ne [IO.DriveType]::Fixed) { throw '[WINDOWS_C_VOLUME_NOT_FIXED]' }
          $cases = @(
            @{name='fixed-new'; path='C:\Program Files\PartyOps-Preview-QA-No-Create'; expected=0},
            @{name='fixed-chinese'; path='C:\PartyOps-Install-中文 空格-Nonexistent'; expected=0},
            @{name='root'; path='C:\'; expected=2},
            @{name='unc'; path='\\example.invalid\share\PartyOps'; expected=2},
            @{name='drive-relative'; path='C:relative-partyops'; expected=2},
            @{name='relative'; path='relative-partyops'; expected=2}
          )
          foreach ($case in $cases) {
            $diag = Join-Path $env:RUNNER_TEMP ('partyops-'+$case.name+'.txt')
            & $ps5 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $probe -Path $case.path -DiagnosticFile $diag
            $code = $LASTEXITCODE
            $detail = if (Test-Path -LiteralPath $diag) { [IO.File]::ReadAllText($diag) } else { '' }
            Write-Host "CASE=$($case.name) EXIT=$code DETAIL=$detail"
            if ($code -ne $case.expected) {
              throw "[INSTALL_PATH_REGRESSION] $($case.name): $code != $($case.expected); $detail"
            }
            if ($case.name -eq 'unc' -and $detail -notmatch 'INSTALL_DIR_NOT_FIXED') {
              throw '[UNC_INSTALL_PATH_ERROR_MUST_BE_EXPLICIT]'
            }
            if ($case.name -in @('drive-relative','relative') -and
                $detail -notmatch 'INSTALL_DIR_INVALID') {
              throw '[RELATIVE_INSTALL_PATH_MUST_BE_REJECTED]'
            }
            Remove-Item -LiteralPath $diag -Force -ErrorAction SilentlyContinue
          }
          'WINDOWS_INSTALL_PATH_POWERSHELL_51_REAL_PROBE_PASS'
          exit 0
