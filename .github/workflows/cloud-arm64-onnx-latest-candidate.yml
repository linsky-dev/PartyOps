name: RC1 native Windows ARM64 latest ONNX Runtime isolated candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-arm64-onnx-latest-candidate.yml'
      - 'scripts/probe_arm64_onnx_latest_candidate.py'
      - 'scripts/probe_arm64_embedding_contract.py'
      - 'scripts/probe_arm64_partyops_embedding_runtime.py'
      - 'backend/tests/test_rc1_arm64_onnx_latest_contract.py'

permissions:
  contents: read

concurrency:
  group: rc1-arm64-onnx-latest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64-latest-onnx:
    name: ARM64 ONNX Runtime 1.32 official wheel and PartyOps EmbeddingRuntime (BUILD_ONLY)
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR test merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up native ARM64 Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Fetch and checksum official ONNX Runtime 1.32 ARM64 wheel
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'artifacts/arm64-onnx-latest/wheels'
          New-Item -ItemType Directory -Force $folder | Out-Null
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest $folder 'onnxruntime==1.32.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = 'onnxruntime-1.32.0-cp312-cp312-win_arm64.whl'
          $candidate = Join-Path $folder $name
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw '[ARM64_ONNX_132_WHEEL_MISSING] Upstream Windows ARM64 3.12 wheel is required.'
          }
          $expected = '64d394c69d561af3efd4d4f49dcac8f11d0ce135a20701c16d53b74056cd4cf8'
          $actual = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw '[ARM64_ONNX_132_SHA_MISMATCH] Official PyPI wheel checksum mismatch.'
          }
          python -m pip install --disable-pip-version-check --only-binary=:all: 'numpy==2.3.5' 'onnx==1.23.2' 'tokenizers==0.23.3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --only-binary=:all: $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test original PartyOps embedding contract and runtime
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/probe_arm64_embedding_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_arm64_partyops_embedding_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe_arm64_onnx_latest_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated latest ONNX candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-onnx-latest-build-only-${{ github.sha }}
          path: |
            artifacts/arm64-onnx-latest/latest-candidate.json
            artifacts/arm64-onnx-candidate/embedding-contract.json
            artifacts/arm64-onnx-candidate/partyops-embedding-runtime.json
          if-no-files-found: warn
          retention-days: 14
