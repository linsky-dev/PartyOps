name: RC1 ephemeral tiny-PE Authenticode QA (NOT PRODUCTION SIGNING)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-windows-x64-authenticode-qa.yml'
      - 'scripts/rc1-windows-upgrade-rollback-smoke.ps1'
      - 'scripts/rc1-windows-installed-smoke.ps1'

permissions:
  actions: read
  contents: read

concurrency:
  group: rc1-authenticode-qa-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  qa-authenticode:
    name: Test ephemeral tiny PE signature and tamper rejection (no PartyOps signing)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Verify QA-only cryptographic test prerequisites (no release artifact)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($command in @('New-SelfSignedCertificate','Set-AuthenticodeSignature','Get-AuthenticodeSignature')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "[QA_SIGNING_PREREQUISITE_MISSING] $command"
            }
          }
          # The real candidate has already been checked as unsigned by the
          # SAME-SOURCE hosted installer smoke. Test only WinVerifyTrust here:
          # no archived, pre-fix PartyOps EXE; no real publisher private key.
          Write-Host 'QA_SIGNING_SCOPE=HARMLESS_TINY_PE_ONLY'
          Write-Host 'QA_SIGNING_REAL_PARTYOPS_INSTALLER_NOT_SIGNED'
      - name: Ephemeral QA-only Authenticode signing and cryptographic tamper rejection
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'partyops-authenticode-result'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $qaCopy = Join-Path $root 'QA_ONLY_NOT_FOR_DISTRIBUTION.exe'
          $tamper = Join-Path $root 'QA_ONLY_TAMPERED.exe'
          $cert = $null
          $report = [ordered]@{
            schema_version = 1
            scope = 'HOSTED_EPHEMERAL_SELF_SIGNED_AUTHENTICODE_MECHANISM_ONLY'
            status = 'FAILED'
            original_candidate_sha256 = $null
            production_certificate_used = $false
            official_installer_signed = $false
            qa_signed_copy_distributable = $false
            original_untouched = $true
            qa_signature_only_on_harmless_tiny_pe = $true
            actual_partyops_exe_signing_proven = $false
            source = 'standalone-harmless-tiny-PE-qa-only'
          }
          try {
            Write-Host 'QA_AUTHENTICODE_STAGE_CERT_CREATE_BEGIN'
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -CertStoreLocation 'Cert:\CurrentUser\My' -Subject 'CN=PartyOps Ephemeral CI QA ONLY - NOT PUBLISHER' -NotAfter (Get-Date).AddDays(1)
            Write-Host 'QA_AUTHENTICODE_STAGE_CERT_CREATED'
            if (-not $cert.HasPrivateKey) { throw '[QA_SIGNING_CERT_PRIVATE_KEY_ABSENT]' }
            # Deliberately DO NOT add ephemeral QA certificates to the Windows
            # trusted Root store. Hosted runners can block this operation (and
            # modifying host trust would be unnecessary for a digest test).
            # An intact self-signed signature must be present but NotTrusted.
            # A production publisher certificate is unavailable. Sign a
            # tiny independently compiled PE only to validate WinVerifyTrust,
            # signer certificate identity and tamper refusal; do NOT pretend
            # that a self-signed QA test has signed the 584 MB PartyOps EXE.
            $source = 'public static class QaOnly { public static int Main() { return 0; } }'
            Write-Host 'QA_AUTHENTICODE_STAGE_TINY_PE_BUILD_BEGIN'
            Add-Type -TypeDefinition $source -OutputAssembly $qaCopy -OutputType ConsoleApplication
            Write-Host 'QA_AUTHENTICODE_STAGE_TINY_PE_BUILT'
            if (-not (Test-Path -LiteralPath $qaCopy -PathType Leaf)) {
              throw '[QA_SIGNING_VALID_TINY_PE_NOT_COMPILED]'
            }
            Write-Host 'QA_AUTHENTICODE_STAGE_SIGN_BEGIN'
            $result = Set-AuthenticodeSignature -FilePath $qaCopy -Certificate $cert -HashAlgorithm SHA256
            Write-Host 'QA_AUTHENTICODE_STAGE_SIGN_RETURNED'
            Write-Host 'QA_AUTHENTICODE_STAGE_VERIFY_BEGIN'
            $valid = Get-AuthenticodeSignature -LiteralPath $qaCopy
            Write-Host "QA_AUTHENTICODE_STAGE_VERIFY_RETURNED=$($valid.Status)"
            if ($valid.Status -ne 'NotTrusted' -or -not $valid.SignerCertificate -or
                $valid.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "[QA_SIGNING_UNTRUSTED_BUT_INTACT_REQUIRED] $($valid.Status) / $($result.Status)"
            }
            $report['qa_signed_copy_verified'] = $true
            $report['qa_signature_trusted_by_windows'] = $false
            $report['qa_certificate_public_thumbprint'] = $cert.Thumbprint
            Copy-Item -LiteralPath $qaCopy -Destination $tamper
            $f = [IO.File]::Open($tamper,[IO.FileMode]::Open,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
            try {
              $offset = [Math]::Min(1024, [Math]::Max(128, [int]($f.Length / 3)))
              if ($offset -ge $f.Length) { throw '[QA_SIGNING_TEST_FILE_TRUNCATED]' }
              $f.Position = $offset
              $value = $f.ReadByte()
              if ($value -lt 0) { throw '[QA_SIGNING_TEST_FILE_TRUNCATED]' }
              $f.Position = $offset
              $f.WriteByte([byte]($value -bxor 1))
            } finally { $f.Dispose() }
            $altered = Get-AuthenticodeSignature -LiteralPath $tamper
            if ($altered.Status -ne 'HashMismatch') {
              throw "[QA_SIGNING_TAMPER_HASH_MISMATCH_REQUIRED] $($altered.Status)"
            }
            $report['tampered_copy_rejected'] = $true
            Write-Host 'QA_AUTHENTICODE_STAGE_TAMPER_TEST_FINISHED'
            $report['status'] = 'PASS_QA_TEST_CERT_ONLY_NOT_PRODUCTION_SIGNED'
          } catch {
            $report['error'] = [string]$_.Exception.Message
          } finally {
            if ($cert) {
              Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $qaCopy,$tamper -Force -ErrorAction SilentlyContinue
            $report['verified_at_utc'] = [DateTime]::UtcNow.ToString('o')
            [IO.File]::WriteAllText((Join-Path $root 'qa-authenticode-evidence.json'),
              ($report | ConvertTo-Json -Depth 5),
              [Text.UTF8Encoding]::new($false))
            Write-Host "QA_AUTHENTICODE_STATUS=$($report.status)"
          }
          if ($report.status -ne 'PASS_QA_TEST_CERT_ONLY_NOT_PRODUCTION_SIGNED') {
            throw "[QA_AUTHENTICODE_FAILED] $($report.error)"
          }

      - name: Upload only QA signature verification evidence, NEVER the QA signed EXE or private key
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partyops-authenticode-qa-mechanism-only-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/partyops-authenticode-result/qa-authenticode-evidence.json
          if-no-files-found: warn
          retention-days: 14
