name: RC1 native ARM64 PyMuPDF Lite PDF API compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_arm64_pdf_lite.py'
      - 'backend/tests/test_rc1_arm64_pdf_lite_contract.py'
      - '.github/workflows/cloud-arm64-pdf-lite-candidate.yml'

permissions:
  contents: read

concurrency:
  group: rc1-arm64-pdf-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdf-lite:
    name: Native Windows ARM64 PDF API synthetic validation (BUILD_ONLY)
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR test merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up native ARM64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Install upstream wheel in isolated native runner
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --only-binary=:all: 'pymupdf-lite==2.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify existing PartyOps PDF API contract against synthetic fixtures
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/probe_arm64_pdf_lite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install only PartyOps PDF intake's portable dependencies
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --only-binary=:all: 'fastapi==0.140.7' 'pytesseract==0.3.13' 'defusedxml==0.7.1' 'python-docx==1.2.0' 'openpyxl==3.1.5' 'pillow==13.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute unchanged PartyOps PDF intake on synthetic inputs
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/probe_arm64_partyops_intake.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated candidate evidence (no release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-pdf-lite-build-only-${{ github.sha }}
          path: |
            artifacts/arm64-pdf-lite/probe.json
            artifacts/arm64-pdf-lite/intake-module.json
          if-no-files-found: warn
          retention-days: 14
