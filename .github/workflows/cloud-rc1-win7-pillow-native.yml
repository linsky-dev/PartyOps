name: RC1 Win7 Pillow native source candidate (NOT INSTALLER)
on:
  pull_request:
    branches: [feature/1.4.6-rc1-cloud-rebuild]
    paths:
      - '.github/workflows/cloud-rc1-win7-pillow-native.yml'
      - 'scripts/rc1_win7_pillow_native.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            python: x64
            bits: 64
            pillow: AMD64
          - arch: x86
            python: x86
            bits: 32
            pillow: x86
    env:
      PYTHONUTF8: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: host
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify Pillow and both pinned native dependency archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'pefile==2024.8.26'
          if ($LASTEXITCODE -ne 0) { throw 'PE_TOOL_MISSING' }
          python scripts/rc1_win7_pillow_native.py (Join-Path $env:RUNNER_TEMP 'pillow-input')
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_PREPARATION_FAILED' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: target
        with:
          python-version: '3.8.10'
          architecture: ${{ matrix.python }}
      - name: Build historical JPEG and zlib recipe and actual CPython 3.8 wheel
        shell: pwsh
        env:
          HOST_PY: ${{ steps.host.outputs.python-path }}
          TARGET_PY: ${{ steps.target.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'pillow-input'
          $src = Join-Path $root 'pillow-12.3.0'
          $out = Join-Path $PWD 'artifacts/win7-pillow'
          $build = Join-Path $root 'build'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$root/source-receipt.json" $out
          & $env:TARGET_PY -c "import sys,struct; assert sys.version_info[:3]==(3,8,10); assert struct.calcsize('P')*8==${{ matrix.bits }}"
          if ($LASTEXITCODE -ne 0) { throw 'WRONG_TARGET_PYTHON' }
          & $env:HOST_PY "$src/winbuild/build_prepare.py" --depends "$root/depends" --dir $build --architecture '${{ matrix.pillow }}' --partyops-win7-minimal
          if ($LASTEXITCODE -ne 0) { throw 'WINBUILD_PREPARATION_FAILED' }
          # Retain upstream build environment but explicitly require VC142.
          $envScript = Join-Path $build 'build_env.cmd'
          $s = Get-Content $envScript -Raw
          $pattern = '(?im)^(\s*call\s+.*vcvarsall(?:\.bat)?["]?\s+\S+)\s*$'
          if ([regex]::Matches($s,$pattern).Count -ne 1) { throw 'VCVARS_LINE_NOT_UNIQUE' }
          $s = [regex]::Replace($s,$pattern,'$1 -vcvars_ver=14.29')
          Set-Content $envScript -Encoding ascii $s
          $env:CL = '/D_WIN32_WINNT=0x0601 /DWINVER=0x0601'
          $cmd = Join-Path $env:RUNNER_TEMP 'build-win7-pillow.cmd'
          @(
            '@echo off',
            "call ""$build\build_dep_all.cmd""",
            'if errorlevel 1 exit /b 11',
            "call ""$envScript""",
            'if errorlevel 1 exit /b 12',
            'echo VCToolsVersion=%VCToolsVersion%',
            'where cl || exit /b 13',
            "cd /d ""$src""",
            """$env:TARGET_PY"" -m pip wheel --no-deps --wheel-dir ""$out"" -C jpeg=enable -C zlib=enable -C webp=disable -C tiff=disable -C freetype=disable -C lcms=disable -C jpeg2000=disable -C imagequant=disable -C raqm=disable -C avif=disable .",
            'if errorlevel 1 exit /b 21'
          ) | Set-Content -Encoding ascii $cmd
          & cmd.exe /d /c $cmd *> "$out/build.log"
          $rc = $LASTEXITCODE
          Get-Content "$out/build.log" -Tail 100
          if ($rc -ne 0) { throw "PILLOW_NATIVE_BUILD_FAILED: $rc" }
          @'
          import importlib.util, pathlib, sys, zipfile
          out, arch = pathlib.Path(sys.argv[1]), sys.argv[2]
          wheels = list(out.glob("*.whl"))
          plat = {"amd64":"win_amd64","x86":"win32"}[arch]
          assert len(wheels)==1 and wheels[0].name.lower()==f"pillow-12.3.0+partyops.1-cp38-cp38-{plat}.whl"
          spec=importlib.util.spec_from_file_location("pe_gate","scripts/validate-win7-pe.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          with zipfile.ZipFile(wheels[0]) as z:
              members=[n for n in z.namelist() if n.lower().endswith((".pyd",".dll"))]
              assert any(n.endswith(".pyd") for n in members)
              for i,n in enumerate(members):
                  p=out/("native-"+str(i)+"-"+pathlib.Path(n).name)
                  p.write_bytes(z.read(n))
                  errors=mod.validate_pe(p,arch,{})
                  assert not errors, errors
          '@ | Set-Content -Encoding utf8 "$out/verify-pe.py"
          & $env:HOST_PY "$out/verify-pe.py" $out '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'PE_GATE_FAILED' }
      - name: Real image encoding and decoding on CPython 3.8
        shell: pwsh
        env:
          TARGET_PY: ${{ steps.target.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'artifacts/win7-pillow'
          $wheel = @(Get-ChildItem $out -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw 'WHEEL_MISSING' }
          & $env:TARGET_PY -m pip install --no-index --no-deps $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'OFFLINE_INSTALL_FAILED' }
          @'
          import io
          from PIL import Image, features, __version__
          assert __version__=="12.3.0+partyops.1"
          assert features.check_codec("jpg") and features.check_codec("zlib")
          assert not features.check("webp")
          im=Image.new("RGB",(128,96),(20,50,80))
          for fmt in ("JPEG","PNG"):
              stream=io.BytesIO()
              im.save(stream,format=fmt)
              stream.seek(0)
              with Image.open(stream) as decoded:
                  decoded.load()
                  assert decoded.size==im.size and decoded.mode=="RGB"
          print("PILLOW_PY38_JPEG_PNG_PASS")
          '@ | Set-Content -Encoding utf8 "$out/smoke.py"
          & $env:TARGET_PY "$out/smoke.py"
          if ($LASTEXITCODE -ne 0) { throw 'PILLOW_RUNTIME_FAILED' }
          @{status='HOSTED_PYTHON38_IMAGE_PASS_NOT_WIN7_OS'; release_ready=$false; source_commit=$env:SOURCE_SHA; wheel=$wheel[0].Name; sha256=(Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content "$out/wheel-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RC1-Win7-${{ matrix.arch }}-Pillow-BUILD-ONLY-${{ env.SOURCE_SHA }}
          path: artifacts/win7-pillow
          if-no-files-found: warn
          retention-days: 14
