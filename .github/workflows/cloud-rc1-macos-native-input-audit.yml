name: RC1 macOS native donor and fresh application input audit (NOT PKG)
on:
  pull_request:
    branches: [main, feature/1.4.6-rc1-cloud-rebuild]
    paths:
      - '.github/workflows/cloud-rc1-macos-native-input-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc1-macos-input-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Audit original RC6 and fresh RC1 inputs ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            python: arm64
            donor_sha: bcc370a22545c31ad789324d1d153a0d6faa30ec61fc0632e4b004f82c0ff736
          - arch: x86_64
            runner: macos-15-intel
            python: x64
            donor_sha: 8885eea0cfa3c23f58d14109c9a46be2bf762c923cb1be58b9c549628e05c955
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ARCH: ${{ matrix.arch }}
      DONOR_SHA: ${{ matrix.donor_sha }}
      CANDIDATE_RUN: '45303616987'
      CANDIDATE_SOURCE: 400dd924faaf3195aef69c24c160a2e6f109a5f0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python }}
      - name: Verify native runner and independently pinned original PKG
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "$TARGET_ARCH"
          mkdir -p artifacts/macos-input-audit "$RUNNER_TEMP/rc1-mac-audit/donor"
          root="$RUNNER_TEMP/rc1-mac-audit"
          name="PartyOps_1.4.5-rc.6_macos_${TARGET_ARCH}-UNSIGNED-UNNOTARIZED-CANDIDATE.pkg"
          gh release download v1.4.5-rc.6 --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$root/donor"
          printf '%s  %s\n' "$DONOR_SHA" "$root/donor/$name" | shasum -a 256 -c -
          pkgutil --expand-full "$root/donor/$name" "$root/expanded"
          archive="$(python - "$root/expanded" <<'PY'
          import pathlib, sys
          matches = list(pathlib.Path(sys.argv[1]).rglob('PartyOps.app.zip'))
          assert len(matches) == 1 and matches[0].is_file() and not matches[0].is_symlink(), matches
          print(matches[0])
          PY
          )"
          mkdir -p "$root/donor-app"
          ditto -x -k "$archive" "$root/donor-app"
          test -d "$root/donor-app/PartyOps.app"
          codesign --verify --deep --strict --verbose=2 "$root/donor-app/PartyOps.app"
      - name: Retrieve actual latest matching source application, not a previous PKG
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rc1-mac-audit"
          run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")"
          test "$(jq -r '.head_sha' <<< "$run_info")" = "$CANDIDATE_SOURCE"
          test "$(jq -r '.head_repository.full_name' <<< "$run_info")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path | split("@")[0]' <<< "$run_info")" = '.github/workflows/cloud-macos-rc1-application-freeze.yml'
          test "$(jq -r '.conclusion' <<< "$run_info")" = success
          mkdir -p "$root/new" "$root/new-app"
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name "partyops-RC1-macos-${TARGET_ARCH}-APP-ONLY-NOT-PKG-${CANDIDATE_SOURCE}" --dir "$root/new"
          archive="PartyOps_1.4.6-rc.1_macos_${TARGET_ARCH}-APP-ONLY-NOT-PKG.zip"
          (cd "$root/new" && shasum -a 256 -c "$archive.sha256")
          ditto -x -k "$root/new/$archive" "$root/new-app"
      - name: Audit original WPS provenance and new app entrypoint hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rc1-mac-audit'
          arch = os.environ['TARGET_ARCH']
          old = root / 'donor-app/PartyOps.app/Contents'
          new = root / 'new-app/PartyOps.app/Contents'
          archive = root / 'new' / f'PartyOps_1.4.6-rc.1_macos_{arch}-APP-ONLY-NOT-PKG.zip'
          rec = json.loads(archive.with_suffix('.receipt.json').read_text())
          def sha(p):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          def native(p):
              assert p.is_file() and os.access(p, os.X_OK), p
              assert arch in subprocess.check_output(['lipo', '-archs', str(p)], text=True).split(), p
              return sha(p)
          assert rec['status'] == 'APP_ONLY_BUILD_ONLY_NOT_PKG'
          assert rec['source_commit'] == os.environ['CANDIDATE_SOURCE']
          assert rec['architecture'] == arch and rec['recovery_help_verified'] is True
          assert rec['archive_sha256'] == sha(archive)
          assert rec['native_formatter_included'] is False and rec['installer_created'] is False
          assert rec['release_ready'] is False
          entries = rec['entrypoint_sha256']
          required = ['partyops', 'partyops-client', 'partyops-wizard', 'partyops-launch-agent', 'partyops-updater', 'partyops-desktop', 'partyops-desktop-bin']
          for name in required:
              assert entries[name] == native(new / 'MacOS' / name), name
          formatter = old / 'Resources/formatter-host'
          source = json.loads((formatter / 'source-host.json').read_text())
          host_hash = native(formatter / 'partyops-document-formatter-host')
          assert source['host_sha256'] == host_hash
          office = old / 'Resources/office-runtime'
          inventory = {
              'formatter_host': host_hash,
              'formatter_source_manifest': sha(formatter / 'source-host.json'),
              'formatter_runtime_evidence': sha(formatter / 'runtime-evidence.json'),
              'ocr': native(old / 'MacOS/tesseract'),
              'ocr_chinese_data': sha(old / 'Resources/ocr/tessdata/chi_sim.traineddata'),
              'local_llm': native(old / 'MacOS/llama-server'),
              'office': native(office / 'LibreOffice.app/Contents/MacOS/soffice'),
              'office_source_manifest': sha(office / 'SOURCE.json'),
          }
          out = pathlib.Path('artifacts/macos-input-audit')
          check = subprocess.run(['python', 'scripts/validate-source-formatter-runtime.py',
              '--runtime', str(formatter), '--platform', 'macos', '--architecture', arch],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
          (out / 'current-formatter-validator.log').write_text(check.stdout)
          record = {'status': 'BUILD_INPUTS_AUDITED_ONLY', 'source_commit': rec['source_commit'],
              'architecture': arch, 'historical_donor_pkg_sha256': os.environ['DONOR_SHA'],
              'candidate_run': os.environ['CANDIDATE_RUN'], 'new_app_archive_sha256': sha(archive),
              'new_app_entrypoint_sha256': {name: entries[name] for name in required},
              'historical_native_input_sha256': inventory, 'historical_formatter_adapter': source.get('adapter'),
              'current_formatter_validator_passed': check.returncode == 0,
              'production_dependency_security_review': 'NOT_RUN', 'native_wps_tests_rerun': False,
              'installer_created': False, 'native_install_tested': False, 'release_ready': False}
          (out / 'receipt.json').write_text(json.dumps(record, indent=2)+'\n')
          if check.returncode:
              print(check.stdout)
              raise SystemExit('HISTORICAL_FORMATTER_CURRENT_PROVENANCE_BLOCKED')
          print('MACOS_NATIVE_INPUT_AUDIT_PASS_NOT_INSTALLER')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: partyops-rc1-macos-${{ matrix.arch }}-NATIVE-INPUT-AUDIT-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/macos-input-audit
          retention-days: 14
          if-no-files-found: warn
