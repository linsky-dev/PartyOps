name: RC1 secure PyMuPDF 2.1 Windows x64 compatibility (BUILD_ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-pymupdf-21-x64-candidate.yml'
      - 'scripts/probe_pymupdf_21_x64.py'
      - 'backend/tests/test_rc1_pymupdf_21_x64_contract.py'

permissions:
  contents: read

concurrency:
  group: rc1-secure-pymupdf-21-x64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-x64:
    name: Official PyMuPDF 2.1 PDF intake and conversion compatibility (BUILD_ONLY)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64

      - name: Download and hash-verify original secure PyMuPDF 2.1 wheel
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $wheelDir = 'artifacts/pymupdf-21-x64/wheels'
          New-Item -ItemType Directory -Force $wheelDir | Out-Null
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest $wheelDir 'pymupdf==2.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Join-Path $wheelDir 'pymupdf-2.1-cp311-abi3-win_amd64.whl'
          if (-not (Test-Path -LiteralPath $wheel -PathType Leaf)) {
            throw '[PYMUPDF_21_NATIVE_WHEEL_MISSING] Unexpected wheel or architecture.'
          }
          $digest = (Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'e1122bbc3a1212396f0d70d19f78e084991b59ebdfc9d846c28ca8b509de01ad') {
            throw '[PYMUPDF_21_PYPI_HASH_MISMATCH] Upstream fixed wheel digest differs.'
          }
          python -m pip install --disable-pip-version-check --no-index --no-deps --only-binary=:all: --find-links $wheelDir 'pymupdf==2.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --only-binary=:all: 'fastapi==0.140.7' 'pytesseract==0.3.13' 'defusedxml==0.7.1' 'python-docx==1.2.0' 'openpyxl==3.1.5' 'pillow==13.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unmodified PartyOps intake and PDF conversion with synthetic documents
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/probe_pymupdf_21_x64.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated evidence, not a signed installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partyops-pymupdf21-x64-build-only-${{ github.sha }}
          path: artifacts/pymupdf-21-x64/compatibility.json
          if-no-files-found: warn
          retention-days: 14
