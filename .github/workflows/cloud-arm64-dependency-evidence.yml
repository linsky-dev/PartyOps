name: RC1 Windows ARM64 locked runtime dependency evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/uv.lock'
      - 'backend/pyproject.toml'
      - 'scripts/audit_windows_arm64_lock.py'
      - 'backend/tests/test_rc1_arm64_runtime_wheel_audit.py'
      - '.github/workflows/cloud-arm64-dependency-evidence.yml'

permissions:
  contents: read

concurrency:
  group: rc1-win-arm64-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel-lock-audit:
    name: Native Windows ARM64 wheel lock inventory (BUILD_ONLY)
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR test merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install native ARM64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Load wheel-tag parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'packaging==25.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check all reachable runtime dependencies in exact frozen lock
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/audit_windows_arm64_lock.py --lock backend/uv.lock --output artifacts/arm64-app-lock/audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib, json, pathlib
          report = json.loads(pathlib.Path("artifacts/arm64-app-lock/audit.json").read_text(encoding="utf-8"))
          assert report["status"] == "BUILD_ONLY"
          assert report["app_installation_verified"] is False
          assert report["release_ready"] is False
          assert report["wheel_availability"] in ("BLOCKED", "MATCHES_AVAILABLE")
          assert report["lock_sha256"] == hashlib.sha256(pathlib.Path("backend/uv.lock").read_bytes()).hexdigest()
          assert report["dependency_count"] >= 1
          print("ARM64 frozen-lock evidence verified; complete app installation is NOT_RUN")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload read-only wheel lock audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-app-lock-build-only-${{ github.sha }}
          path: artifacts/arm64-app-lock/audit.json
          if-no-files-found: warn
          retention-days: 14
