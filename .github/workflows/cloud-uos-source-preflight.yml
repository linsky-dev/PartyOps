name: RC1 UOS V20 focused packaging preflight (SOURCE_ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-uos-source-preflight.yml'
      - 'scripts/rc1_uos_preflight.py'
      - 'backend/tests/test_rc1_uos_packaging_preflight.py'
      - 'packaging/uos/build-portable.sh'
      - 'packaging/uos/one-click-install.sh'
      - 'packaging/linux/build-native.sh'
      - 'packaging/linux/post-install-transaction.sh'
      - 'packaging/uos/desktop-launcher.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partyops-rc1-uos-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uos-packaging-source:
    name: UOS candidate ${{ matrix.architecture }} source-only preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact review source (no WPS changes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture == 'amd64' && 'x64' || 'arm64' }}

      - name: Validate only touched UOS packaging contracts
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1'
          python scripts/verify-version-consistency.py --root . --expected 1.4.6-rc.1
          bash -n packaging/uos/build-portable.sh packaging/uos/one-click-install.sh \
            packaging/linux/build-native.sh packaging/linux/post-install-transaction.sh
          python -m pytest --noconftest -q backend/tests/test_rc1_uos_packaging_preflight.py
          mkdir -p artifacts/uos-source
          python scripts/rc1_uos_preflight.py --architecture "$TARGET_ARCH" \
            --output "artifacts/uos-source/preflight-$TARGET_ARCH.json"
          python - "$TARGET_ARCH" <<'PY'
          import json
          import sys
          from pathlib import Path
          record = json.loads((Path("artifacts/uos-source") / f"preflight-{sys.argv[1]}.json").read_text(encoding="utf-8"))
          assert record["checks_passed"] is True
          assert record["status"] == "PASS_SOURCE_CONTRACT_ONLY"
          assert record["native_uos_install"] == "NOT_RUN"
          assert record["native_uos_wps_gold_samples"] == "NOT_RUN"
          assert record["authentic_uos_deb_artifact"] is False
          assert record["release_ready"] is False
          print(f"UOS_SOURCE_ONLY_PASS arch={sys.argv[1]} sha={record['source_commit']}")
          PY

      - name: Publish source-only metadata, never call this a UOS DEB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partyops-uos-${{ matrix.architecture }}-SOURCE_ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/uos-source/preflight-${{ matrix.architecture }}.json
          if-no-files-found: warn
          retention-days: 14
