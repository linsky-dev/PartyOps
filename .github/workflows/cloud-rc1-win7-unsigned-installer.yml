name: RC1 Win7 actual unsigned candidate EXE (NOT RELEASE)
on:
  pull_request:
    branches: [feature/1.4.6-rc1-cloud-rebuild]
    paths:
      - '.github/workflows/cloud-rc1-win7-unsigned-installer.yml'
      - 'scripts/rc1_win7_assemble_installer.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            python: x64
            donor_sha: 996159794407f2171de170fbbf95c3b1f3fe234c026116f35113c2d8d3591d7f
          - arch: x86
            python: x86
            donor_sha: b3b77f2a5a319906c641ca693df31b93c3fbcb56e28eaae7a52bdfa94913bf88
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      ARCH: ${{ matrix.arch }}
      DONOR_SHA: ${{ matrix.donor_sha }}
      PARTYOPS_QA_EXPECTED_SOURCE: 5ea9c6a128f3d8aa71ff77e7e549f4fbd6115fdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.8.10'
          architecture: ${{ matrix.python }}
      - name: Recover exact native app, original RC6 installer and verified extractor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/45417203694" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne '8fca40a840e94bbfed8436fd1242b24cf4fd8c89' -or $run.conclusion -ne 'success' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.path -ne '.github/workflows/cloud-rc1-win7-application-freeze.yml') { throw 'APP_FREEZE_PROVENANCE_INVALID' }
          $root=Join-Path $env:RUNNER_TEMP 'win7-package-input'
          New-Item -ItemType Directory -Force $root | Out-Null
          gh run download 45417203694 --repo $env:GITHUB_REPOSITORY --name "RC1-Win7-$env:ARCH-APP-ONLY-NOT-INSTALLER-5ea9c6a128f3d8aa71ff77e7e549f4fbd6115fdb" --dir "$root/fresh"
          if ($LASTEXITCODE -ne 0) { throw 'APP_FREEZE_DOWNLOAD_FAILED' }
          if ($env:ARCH -eq 'amd64') {
            $closure=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/45370727222" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $closure.head_sha -ne '2122c220fd3af2e8040f4b8ffab01c778c70da88' -or $closure.conclusion -ne 'success' -or $closure.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $closure.path -ne '.github/workflows/cloud-rc1-win7-complete-candidate.yml') { throw 'NUMPY_CLOSURE_RUN_INVALID' }
            gh run download 45370727222 --repo $env:GITHUB_REPOSITORY --name 'RC1-Win7-amd64-COMPLETE-CANDIDATE-CLOSURE-NOT-RELEASE-2122c220fd3af2e8040f4b8ffab01c778c70da88' --dir "$root/verified-closure"
            if ($LASTEXITCODE -ne 0) { throw 'NUMPY_CLOSURE_DOWNLOAD_FAILED' }
          }
          $file="PartyOps_1.4.5-rc.6_windows7_$env:ARCH.exe"
          gh release download v1.4.5-rc.6 --repo $env:GITHUB_REPOSITORY --pattern $file --dir $root
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash "$root/$file").Hash.ToLowerInvariant() -ne $env:DONOR_SHA) { throw 'RC6_DONOR_INVALID' }
          curl.exe --fail --location --retry 3 --output "$root/extractor.zip" 'https://github.com/UserUnknownFactor/innoextract_win/releases/download/670/innoextract670.zip'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash "$root/extractor.zip").Hash.ToLowerInvariant() -ne '79b69b9b1fcd98f42ccd4b245efdf6a03bcfb674ba6af482f5a46891c9ed4d14') { throw 'EXTRACTOR_INVALID' }
          Expand-Archive "$root/extractor.zip" "$root/extractor-unpacked"
          New-Item -ItemType Directory -Force "$root/extractor" | Out-Null
          $hashes=@{'innoextract.exe'='0dab51583e403970065db49f87a6a2bf683ab6ebfdf27bede2bf633dd232a1a2';'libbz2-1.dll'='b79cd3a7102e359ef6324e98966a67939e58ec2b651ae2847cae84a4dfa453f7'}
          foreach ($name in $hashes.Keys) {
            $files=@(Get-ChildItem "$root/extractor-unpacked" -Recurse -File -Filter $name)
            if ($files.Count -ne 1 -or (Get-FileHash $files[0].FullName).Hash.ToLowerInvariant() -ne $hashes[$name]) { throw 'EXTRACTOR_COMPONENT_INVALID' }
            Copy-Item $files[0].FullName "$root/extractor/$name"
          }
          & "$root/extractor/innoextract.exe" --extract --output-dir "$root/donor" "$root/$file"
          if ($LASTEXITCODE -ne 0) { throw 'DONOR_EXTRACT_FAILED' }
      - name: Verify old manifest and recover only unchanged named native prerequisites
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'win7-package-input'
          python -m pip install 'pefile==2023.2.7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_win7_package_preflight.py "$root/fresh" "$root/donor" artifacts/win7-package-preflight $env:ARCH
          if ($LASTEXITCODE -ne 0) { throw 'WIN7_PACKAGE_PREFLIGHT_BLOCKED' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '5ea9c6a128f3d8aa71ff77e7e549f4fbd6115fdb'
          path: packaging-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Stage unchanged manifest-verified Office and OCR and brand assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'win7-package-input'
          $bundle=(Resolve-Path 'artifacts/win7-package-preflight/app-with-prerequisites').Path
          python scripts/rc1_win7_assemble_installer.py "$root/donor" $bundle packaging-source $env:ARCH
          if ($LASTEXITCODE -ne 0) { throw 'WIN7_ASSEMBLY_INPUTS_INVALID' }
      - name: Build exact unchanged upstream formatter and verify official .NET offline prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle=(Resolve-Path 'artifacts/win7-package-preflight/app-with-prerequisites').Path
          $repo=(Resolve-Path packaging-source).Path
          $arch=if ($env:ARCH -eq 'amd64') {'x64'} else {'x86'}
          $python=(python -c 'import sys;print(sys.executable)').Trim()
          & "$repo/scripts/build-document-formatter-host.ps1" -Platform $arch -StageDirectory "$repo/artifacts/win7-formatter-host" -PythonPath $python
          if ($LASTEXITCODE -ne 0) { throw 'FORMATTER_BUILD_FAILED' }
          Copy-Item -LiteralPath "$repo/artifacts/win7-formatter-host" -Destination "$bundle/formatter-host" -Recurse
          # The helper intentionally restricts its destination to the exact source repo.
          . "$repo/packaging/windows/prepare-dotnet48-runtime.ps1"
          Add-VerifiedPartyOpsDotNet48Prerequisite -RepoRoot $repo -Destination "$repo/artifacts/win7-prerequisites"
          Copy-Item -LiteralPath "$repo/artifacts/win7-prerequisites" -Destination "$bundle/prerequisites" -Recurse
          @{status='HISTORICAL_WPS_REFERENCE_ONLY';architecture=$arch;current_version_native_wps_tested=$false;full_function_gate_passed=$false;release_ready=$false} | ConvertTo-Json | Set-Content "$bundle/formatter-host/qa-status.json"
      - name: Apply original full package PE gate and make exact new release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install 'pefile==2024.8.26'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle=(Resolve-Path 'artifacts/win7-package-preflight/app-with-prerequisites').Path
          python packaging-source/scripts/validate-win7-pe.py --root $bundle --architecture $env:ARCH
          if ($LASTEXITCODE -ne 0) { throw 'FULL_WIN7_PE_GATE_BLOCKED' }
          # Match original packaging: the installer-only prerequisite must not enter the installed manifest.
          $prerequisites=Join-Path $env:RUNNER_TEMP 'win7-manifest-prerequisites'
          Move-Item -LiteralPath "$bundle/prerequisites" -Destination $prerequisites
          $profile=if ($env:ARCH -eq 'amd64') {'legacy-smart'} else {'legacy-core'}
          python packaging-source/scripts/generate-release-manifest.py --root $bundle --output "$bundle/release-manifest.json" --version '1.4.6-rc.1' --tag 'v1.4.6-rc.1' --commit '5ea9c6a128f3d8aa71ff77e7e549f4fbd6115fdb' --platform windows7 --architecture $env:ARCH --runtime-profile $profile
          if ($LASTEXITCODE -ne 0 -or (Get-Item "$bundle/release-manifest.json").Length -gt 8MB) { throw 'RELEASE_MANIFEST_INVALID' }
          Move-Item -LiteralPath $prerequisites -Destination "$bundle/prerequisites"
      - name: Compile actual original Win7 Inno installer as an unsigned QA candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@((Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'), (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'))
          $inno=$paths | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $inno) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'INNO_SETUP_UNAVAILABLE' }
            $inno=$paths | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $inno) { throw 'INNO_COMPILER_MISSING' }
          $env:PARTYOPS_WINDOWS_BUILD_ROOT=(Resolve-Path 'artifacts/win7-package-preflight/app-with-prerequisites').Path
          New-Item -ItemType Directory -Force artifacts/win7-installer | Out-Null
          $env:PARTYOPS_WINDOWS_OUTPUT_ROOT=(Resolve-Path 'artifacts/win7-installer').Path
          # Use current installer template, not old RC6 payload or old business code.
          # The QA build is conspicuously named; do not publish or sign.
          $base="PartyOps_1.4.6-rc.1_windows7_$env:ARCH" + '_BUILD_ONLY_UNVERIFIED'
          $defines=@('/DPartyOpsLegacy',"/DPartyOpsOutputBase=$base")
          if ($env:ARCH -eq 'x86') { $defines+= '/DPartyOpsX86' }
          & $inno @defines 'packaging-source/packaging/windows/PartyOps.iss' *> artifacts/win7-installer/inno.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/win7-installer/inno.log -Tail 60; throw 'WIN7_INNO_BUILD_FAILED' }
          $exe=Join-Path $env:PARTYOPS_WINDOWS_OUTPUT_ROOT "$base.exe"
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 1MB) { throw 'INSTALLER_MISSING' }
          $hash=(Get-FileHash $exe).Hash.ToLowerInvariant()
          "$hash  $base.exe" | Set-Content "$exe.sha256"
          if ((Get-AuthenticodeSignature $exe).Status -ne 'NotSigned') { throw 'UNEXPECTED_INSTALLER_SIGNATURE' }
          @{status='UNSIGNED_WIN7_INSTALLER_BUILD_ONLY';architecture=$env:ARCH;source_commit='5ea9c6a128f3d8aa71ff77e7e549f4fbd6115fdb';sha256=$hash;installer_created=$true;full_pe_gate_passed=$true;native_win7_os_tested=$false;current_version_native_wps_tested=$false;security_backports_approved=$false;release_ready=$false;published=$false} | ConvertTo-Json | Set-Content "$exe.candidate.json"
      - name: Actually install the exact same-run EXE and verify launcher and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path "artifacts/win7-installer/PartyOps_1.4.6-rc.1_windows7_$($env:ARCH)_BUILD_ONLY_UNVERIFIED.exe").Path
          $receipt=Get-Content "$exe.candidate.json" -Raw | ConvertFrom-Json
          if ($receipt.source_commit -ne $env:PARTYOPS_QA_EXPECTED_SOURCE -or $receipt.architecture -ne $env:ARCH -or (Get-FileHash $exe).Hash.ToLowerInvariant() -ne $receipt.sha256 -or $receipt.release_ready) { throw 'SAME_RUN_CANDIDATE_RECEIPT_INVALID' }
          & ./scripts/rc1-win7-hosted-installed-smoke.ps1 -Installer $exe -ExpectedSha256 $receipt.sha256 -OutputDirectory "$env:RUNNER_TEMP/win7-hosted-evidence" -LegacyArchitecture $env:ARCH -ConfirmEphemeralHostedRunner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RC1-Win7-${{ matrix.arch }}-UNSIGNED-EXE-BUILD-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/win7-installer/*
            artifacts/win7-package-preflight/*json
            ${{ runner.temp }}/win7-hosted-evidence
          if-no-files-found: warn
          retention-days: 14
