name: RC1 Loong64 signed Debian rootfs and emulated runtime probe (NOT DEEPIN)
on:
  pull_request:
    branches: [main, feature/1.4.6-rc1-cloud-rebuild]
    paths:
      - '.github/workflows/cloud-rc1-loong64-emulated-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulated-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 400dd924faaf3195aef69c24c160a2e6f109a5f0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Prepare Ubuntu signed QEMU and Debian bootstrap tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/loong64-emulated
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support debootstrap debian-archive-keyring
          test -x /usr/bin/qemu-loongarch64-static
          /usr/bin/qemu-loongarch64-static --version | tee artifacts/loong64-emulated/qemu-version.txt
          sudo update-binfmts --enable qemu-loongarch64
          cat /proc/sys/fs/binfmt_misc/qemu-loongarch64 | tee artifacts/loong64-emulated/binfmt.txt
          test -r /usr/share/keyrings/debian-archive-keyring.gpg
      - name: Bootstrap signed Debian LoongArch64 sysroot, not claimed as Deepin
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/loong64-root"
          sudo debootstrap --foreign --arch=loong64 --variant=minbase --keyring=/usr/share/keyrings/debian-archive-keyring.gpg sid "$root" https://deb.debian.org/debian 2>&1 | tee artifacts/loong64-emulated/bootstrap.log
          sudo install -m 0755 /usr/bin/qemu-loongarch64-static "$root/usr/bin/qemu-loongarch64-static"
          sudo chroot "$root" /debootstrap/debootstrap --second-stage 2>&1 | tee artifacts/loong64-emulated/second-stage.log
          sudo chroot "$root" dpkg --print-architecture | tee artifacts/loong64-emulated/architecture.txt
          test "$(cat artifacts/loong64-emulated/architecture.txt)" = loong64
          sudo chroot "$root" getconf GNU_LIBC_VERSION | tee artifacts/loong64-emulated/glibc.txt
          sudo chroot "$root" apt-get update
          sudo chroot "$root" apt-get install -y --no-install-recommends python3 ca-certificates
          sudo chroot "$root" apt-cache policy python3 python3-venv python3-dev python3-cryptography python3-pymupdf python3-onnxruntime python3-tokenizers python3-numpy python3-pyinstaller tesseract-ocr libreoffice-writer | tee artifacts/loong64-emulated/package-availability.txt
      - name: Exercise exact new source syntax and architecture Python, offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          root="$RUNNER_TEMP/loong64-root"
          sudo mkdir -p "$root/partyops-source"
          sudo cp -a backend/app backend/alembic "$root/partyops-source/"
          sudo chmod -R a+rX "$root/partyops-source"
          sudo unshare --net chroot --userspec=65534:65534 "$root" /usr/bin/python3 -c 'import platform,sqlite3,ssl,pathlib; assert platform.machine() in ("loongarch64","loong64"); files=list(pathlib.Path("/partyops-source").rglob("*.py")); assert files; [compile(f.read_bytes(),str(f),"exec") for f in files]; print(platform.machine(),sqlite3.sqlite_version,ssl.OPENSSL_VERSION,"RC1_SOURCE_COMPILED",len(files))' | tee artifacts/loong64-emulated/source-syntax.txt
      - name: Exercise native Debian packaged PDF, crypto, ONNX and tokenizers in QEMU (separate from PartyOps lock)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/loong64-root"
          sudo chroot "$root" apt-get install -y --no-install-recommends python3-cryptography python3-pymupdf python3-fitz python3-onnxruntime python3-tokenizers python3-numpy python3-pyinstaller
          sudo unshare --net chroot --userspec=65534:65534 "$root" /usr/bin/python3 -c 'import platform,fitz,pymupdf,numpy,onnxruntime,tokenizers,cryptography; assert fitz.open is pymupdf.open; assert platform.machine() in ("loongarch64","loong64"); d=fitz.open(); p=d.new_page(); p.insert_text((72,72),"PartyOps LoongArch64"); assert "PartyOps LoongArch64" in p.get_text(); print("LOONG64_DEBIAN_DEPENDENCIES_IMPORT_PASS",fitz.VersionBind,numpy.__version__,onnxruntime.__version__,tokenizers.__version__,cryptography.__version__)' | tee artifacts/loong64-emulated/native-debian-dependency-smoke.txt
          sudo chroot "$root" dpkg-query -W -f='\${Package}\t\${Version}\t\${Architecture}\n' > artifacts/loong64-emulated/installed-packages.tsv
      - name: Verify historical donor hash and execute original Loong64 wizard and updater offline
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/loong64-root"
          donor=PartyOps_1.4.5-rc.6_linux_loong64.deb
          gh release download v1.4.5-rc.6 --repo "$GITHUB_REPOSITORY" --pattern "$donor" --dir "$RUNNER_TEMP"
          printf '%s  %s\n' bec5993a12a9a66800fa039045f45329ecc486934cd1d1106c10d5e2ecf78017 "$RUNNER_TEMP/$donor" | sha256sum -c -
          test "$(dpkg-deb -f "$RUNNER_TEMP/$donor" Architecture)" = loong64
          mkdir -p "$RUNNER_TEMP/donor-extracted"
          dpkg-deb -x "$RUNNER_TEMP/$donor" "$RUNNER_TEMP/donor-extracted"
          sudo mkdir -p "$root/opt"
          sudo cp -a "$RUNNER_TEMP/donor-extracted/opt/partyops" "$root/opt/"
          sudo chmod -R a+rX "$root/opt/partyops"
          # Keep original donor execution separate from RC1 source validation.
          # Use a writable isolated home, no network or inherited host credentials.
          sudo mkdir -p "$root/tmp/partyops-probe-home"
          sudo chown 65534:65534 "$root/tmp/partyops-probe-home"
          sudo find "$root/opt/partyops" -maxdepth 1 -printf '%f\n' | tee artifacts/loong64-emulated/donor-entrypoints.txt
          failed=0
          for entry in partyops-wizard partyops-updater; do
            file="$root/opt/partyops/$entry"
            if ! test -f "$file"; then echo "DONOR_ENTRY_MISSING: $entry"; failed=1; continue; fi
            readelf -h -l -d "$file" > "artifacts/loong64-emulated/$entry-elf.txt"
            set +e
            sudo timeout 120 unshare --net chroot --userspec=65534:65534 "$root" /usr/bin/env -i HOME=/tmp/partyops-probe-home PATH=/usr/bin:/bin LANG=C.UTF-8 "/opt/partyops/$entry" --help > "artifacts/loong64-emulated/$entry-help.txt" 2>&1
            rc=$?
            set -e
            cat "artifacts/loong64-emulated/$entry-help.txt"
            printf '%s\n' "$rc" > "artifacts/loong64-emulated/$entry-exit-code.txt"
            if [[ "$rc" != 0 ]] || ! test -s "artifacts/loong64-emulated/$entry-help.txt"; then failed=1; fi
          done
          test "$failed" = 0
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('artifacts/loong64-emulated')
          (p/'receipt.json').write_text(json.dumps({'status':'EMULATED_HISTORICAL_RUNTIME_AND_RC1_SOURCE_SYNTAX_ONLY',
              'source_commit':os.environ['SOURCE_SHA'],'target_architecture':'loong64','system':'Debian sid QEMU user-mode',
              'historical_donor':'RC6','historical_runtime_executed':True,'new_application_frozen':False,
              'native_deepin_tested':False,'installer_created':False,'release_ready':False},indent=2)+'\n')
          PY
      - name: Probe current RC1 application dependency availability and import in emulated Loong64 Debian
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/loong64-root"
          out="$PWD/artifacts/loong64-emulated"
          packages=(python3-fastapi python3-starlette python3-uvicorn python3-sqlalchemy python3-alembic python3-pydantic-settings python3-argon2 python3-multipart python3-sse-starlette python3-docx python3-lxml python3-openpyxl python3-python-calamine python3-pil python3-pytesseract python3-defusedxml python3-httpx python3-packaging python3-tk python3-pysqlite3)
          available=()
          for name in "${packages[@]}"; do
            candidate="$(sudo chroot "$root" apt-cache policy "$name" | awk '/Candidate:/ {print $2; exit}')"
            printf '%s\t%s\n' "$name" "${candidate:-MISSING}" | tee -a "$out/current-app-dependencies.tsv"
            if [[ -n "$candidate" && "$candidate" != '(none)' ]]; then available+=("$name"); fi
          done
          sudo chroot "$root" apt-get install -y --no-install-recommends "${available[@]}"
          sudo mkdir -p "$root/tmp/rc1-app-data"
          sudo chown 65534:65534 "$root/tmp/rc1-app-data"
          set +e
          sudo timeout 180 unshare --net chroot --userspec=65534:65534 "$root" /usr/bin/env -i HOME=/tmp/rc1-app-data PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONPATH=/partyops-source PARTYOPS_DATA_DIR=/tmp/rc1-app-data PARTYOPS_ENVIRONMENT=test PARTYOPS_MODE=personal /usr/bin/python3 -c 'import platform,sys; print(sys.version); assert platform.machine() in ("loongarch64","loong64"); import app.main; assert app.main.app.version=="1.4.6-rc.1"; print("RC1_LOONG64_DEBIAN_SOURCE_IMPORT_PASS")' > "$out/current-app-import.log" 2>&1
          rc=$?
          set -e
          cat "$out/current-app-import.log"
          printf '%s\n' "$rc" > "$out/current-app-import-exit.txt"
          sudo chroot "$root" dpkg-query -W > "$out/current-app-sysroot-packages.tsv"
          # Source dependency discovery only: Debian sid and its Python version
          # are not the pinned Deepin core release build environment.
          test "$rc" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: partyops-RC1-loong64-EMULATED-RUNTIME-PROBE-${{ env.SOURCE_SHA }}
          path: artifacts/loong64-emulated
          retention-days: 14
          if-no-files-found: warn
