name: RC1 prepackage gate - full Windows regression (NO INSTALLER)
on:
  pull_request:
    branches: [qa/rc1-cross-platform-source-convergence-20261125, qa/rc1-windows-interactive-wizard-fix-20261126]
    paths:
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'packaging/windows/**'
      - '.github/workflows/cloud-rc1-recovery-prepackage-gate.yml'
      - '.github/workflows/cloud-rc1-windows-interactive-wizard-fix.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: rc1-windows-x64-secure-pdf-full-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Real Windows x64 complete backend tests with isolated PyMuPDF 2.1 lock
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64

      - name: Resolve the existing backend with only PyMuPDF changed in a disposable project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'uv==0.11.7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_windows_pdf_lock_review.py prepare --root . --candidate artifacts/windows-pdf-full-regression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv lock --project artifacts/windows-pdf-full-regression --upgrade-package pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_windows_pdf_lock_delta.py --baseline backend/uv.lock --candidate artifacts/windows-pdf-full-regression/uv.lock --output artifacts/windows-pdf-full-regression-delta.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_pymupdf_21_wheel_matrix.py --lock artifacts/windows-pdf-full-regression/uv.lock --output artifacts/windows-pdf-full-regression-wheel-matrix.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project artifacts/windows-pdf-full-regression --locked --no-install-project --group dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = 'artifacts/windows-pdf-full-regression/.venv/Scripts/python.exe'
          uv pip install --python $python 'pytest==9.1.1' 'pytest-cov==6.2.1' 'pytest-asyncio==1.4.0' -r qa/vm-lab/requirements.txt -r packaging/windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import importlib.metadata; assert importlib.metadata.version('pymupdf') == '2.1'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the unmodified PartyOps Windows backend regression suite and coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '../artifacts/windows-pdf-full-regression/.venv/Scripts/python.exe'
          New-Item -ItemType Directory -Path artifacts/windows-pdf-full-regression-evidence -Force | Out-Null
          Push-Location backend
          try {
            & $python -m pytest tests -rs --cov=app --cov-branch --cov-report=json:../artifacts/windows-pdf-full-regression-evidence/coverage.json --junitxml=../artifacts/windows-pdf-full-regression-evidence/junit.xml 2>&1 | Tee-Object -FilePath ../artifacts/windows-pdf-full-regression-evidence/pytest.log
            if ($LASTEXITCODE -ne 0) { throw '[WINDOWS_SECURE_PDF_21_BACKEND_REGRESSION_FAILED]' }
          } finally {
            Pop-Location
          }

      - name: Enforce original release coverage thresholds, then verify unchanged production lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/verify-coverage.py artifacts/windows-pdf-full-regression-evidence/coverage.json --line 95 --branch 92
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rc1_windows_pdf_lock_review.py finalize --root . --candidate artifacts/windows-pdf-full-regression --evidence artifacts/windows-pdf-full-regression-evidence/provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content -LiteralPath artifacts/windows-pdf-full-regression-evidence/provenance.json -Raw | ConvertFrom-Json
          if ($evidence.release_ready -or $evidence.production_upgrade_approved -or -not $evidence.production_files_unchanged) {
            throw '[WINDOWS_SECURE_PDF_21_UNAUTHORIZED_PRODUCTION_CHANGE]'
          }
          foreach ($name in @('junit.xml', 'coverage.json', 'pytest.log', 'provenance.json')) {
            $file = Join-Path 'artifacts/windows-pdf-full-regression-evidence' $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "[RC1_PREPACKAGE_REQUIRED_EVIDENCE_MISSING] $name"
            }
          }
          'PartyOps Windows x64 full backend under isolated CVE-remediated PyMuPDF 2.1: test-only, source unchanged.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload only regression, coverage and candidate-lock evidence, not an installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partyops-rc1-win-x64-secure-pdf21-full-backend-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/windows-pdf-full-regression-evidence/**
            artifacts/windows-pdf-full-regression/uv.lock
            artifacts/windows-pdf-full-regression/pyproject.toml
            artifacts/windows-pdf-full-regression-delta.json
            artifacts/windows-pdf-full-regression-wheel-matrix.json
          if-no-files-found: error
          retention-days: 14

  linux-system-regression:
    name: Linux targeted system regressions and POSIX key permissions (no installer)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'qa/rc1-windows-interactive-wizard-fix-20261126' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare isolated dependency environment, preserve production lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.11.7'
          python scripts/rc1_windows_pdf_lock_review.py prepare --root . --candidate artifacts/linux-pdf-regression
          uv lock --project artifacts/linux-pdf-regression --upgrade-package pymupdf
          python scripts/rc1_windows_pdf_lock_delta.py --baseline backend/uv.lock --candidate artifacts/linux-pdf-regression/uv.lock --output artifacts/linux-pdf-delta.json
          uv sync --project artifacts/linux-pdf-regression --locked --no-install-project --group dev
          py=artifacts/linux-pdf-regression/.venv/bin/python
          uv pip install --python "$py" 'pytest==9.1.1' 'pytest-cov==6.2.1' 'pytest-asyncio==1.4.0' -r qa/vm-lab/requirements.txt
          uv pip check --python "$py"
          "$py" -c "import importlib.metadata; assert importlib.metadata.version('pymupdf') == '2.1'"
          git diff --exit-code -- backend/uv.lock backend/pyproject.toml backend/requirements.txt
      - name: Exercise changed system boundaries and earlier account and transport contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-system-regression
          cd backend
          ../artifacts/linux-pdf-regression/.venv/bin/python -m pytest -rs \
            tests/test_auth_hardening.py tests/test_pairing_expiry.py \
            tests/test_support_routes.py tests/test_rc3_remaining_branch_gate.py \
            tests/test_rc1_agent_identity.py tests/test_rc2_ai_key_storage.py \
            tests/test_rc1_account_recovery.py tests/test_rc1_recovery_cli.py \
            tests/test_rc1_transport_enrollment_boundaries.py \
            --junitxml=../artifacts/linux-system-regression/junit.xml \
            2>&1 | tee ../artifacts/linux-system-regression/pytest.log
      - name: Ensure real POSIX key mode check ran
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/linux-system-regression/junit.xml')
          matches = [case for case in root.iter('testcase') if case.get('name') == 'test_new_key_is_private_before_atomic_publication']
          assert len(matches) == 1 and not any(matches[0].find(tag) is not None for tag in ('skipped','failure','error'))
          PY
          git diff --exit-code -- backend/uv.lock backend/pyproject.toml backend/requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: partyops-linux-system-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/linux-system-regression/**
            artifacts/linux-pdf-delta.json
          if-no-files-found: error
          retention-days: 14
