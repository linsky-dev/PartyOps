name: RC1 personal data preservation and recovery targeted QA
on:
  pull_request:
    branches: [qa/rc1-flexible-personal-startup-20261124]
    paths:
      - 'backend/app/setup_wizard.py'
      - 'backend/app/desktop_recovery.py'
      - 'backend/tests/test_rc1_personal_source_preservation.py'
      - '.github/workflows/cloud-rc1-personal-source-preservation.yml'
permissions:
  contents: read
jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing locked runtime and test tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.7
          uv sync --project backend --frozen --group dev
          uv pip install --python backend/.venv pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.16.4
      - name: Exercise actual source guard, recovery transaction, bind retries and prior ownership tests
        working-directory: backend
        run: |
          uv run --frozen --no-sync python -m pytest tests/test_rc1_personal_source_preservation.py tests/test_rc1_personal_bind_retry.py tests/test_rc1_desktop_recovery.py tests/test_rc1_recovery_cli.py tests/test_setup_wizard_process_ownership_rc9.py -rs --junitxml=../personal-qa.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: personal-data-qa-${{ matrix.runner }}-${{ github.event.pull_request.head.sha }}
          path: personal-qa.xml
          if-no-files-found: warn
