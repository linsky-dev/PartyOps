# 本地审阅稿；由主控沿已注册 rc4 工作流路径在专属分支上传。
name: ARM SDK RC6 isolated preflight
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '输入 ARM_SDK_RC6_PREFLIGHT；仅官方 ARM SDK 取证'
        required: true
        type: string
permissions:
  contents: read
jobs:
  arm-sdk-preflight:
    if: inputs.confirmation == 'ARM_SDK_RC6_PREFLIGHT'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed probe only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qa/vm-lab/release-preparation/apple-silicon-build-20261009/native-sdk-probe.sh
          sparse-checkout-cone-mode: false
      - name: Inspect official bottle without installing or executing SDK
        shell: bash
        env:
          PARTYOPS_PROBE_CONFIRM: ${{ inputs.confirmation }}
        run: bash qa/vm-lab/release-preparation/apple-silicon-build-20261009/native-sdk-probe.sh
      - name: Upload redacted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm-sdk-rc6-preflight
          path: |
            ${{ runner.temp }}/partyops-arm-sdk-reports/sdk-receipt.json
            ${{ runner.temp }}/partyops-arm-sdk-reports/binary-manifest.json
          if-no-files-found: warn
          retention-days: 7
