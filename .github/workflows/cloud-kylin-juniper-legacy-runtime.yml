name: Early Kylin ARM64 compatibility - dependency intake and SQLite rebuild (NO INSTALLER)
on:
  pull_request:
    types: [opened]
    branches: [qa/rc2-system-hardening-20261126]
    paths:
      - '.github/workflows/cloud-kylin-juniper-legacy-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dependency-intake:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Attempt full closure and identify exact unavailable dependency wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/closure evidence/individual
          python -m pip install 'packaging==25.0'
          python - <<'PY'
          import subprocess,tomllib,json,hashlib
          from pathlib import Path
          lock=tomllib.loads(Path('backend/uv.lock').read_text())
          versions={p['name']:p['version'] for p in lock['package']}
          names=['argon2-cffi-bindings','cryptography','lxml','onnxruntime','pillow']
          args=['python','-m','pip','download','--disable-pip-version-check','--python-version','311','--implementation','cp','--abi','cp311','--only-binary=:all:','--platform','manylinux2014_aarch64','--platform','manylinux_2_17_aarch64']
          def run(args,log):
              result=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              Path(log).write_text(result.stdout)
              print(result.stdout[-3000:])
              return result.returncode
          rows=[]
          for name in names:
              dest=Path('evidence/individual')/name
              dest.mkdir()
              code=run(args+['--no-deps','--dest',str(dest),f'{name}=={versions[name]}'],f'evidence/{name}.log')
              wheels=[{'name':p.name,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()} for p in dest.glob('*.whl')]
              rows.append({'name':name,'version':versions[name],'exit':code,'wheels':wheels})
          code=run(args+['--dest','evidence/closure','-r','backend/requirements.txt','-r','backend/requirements-local-ai.txt','-r','packaging/uos/requirements-build.txt'],'evidence/closure.log')
          validator=None
          if code==0:
              validator=run(['python','scripts/validate-uos-wheelhouse.py','--architecture','arm64','--runtime-profile','full','--wheelhouse','evidence/closure','--requirements','backend/requirements.txt','backend/requirements-local-ai.txt','packaging/uos/requirements-build.txt'],'evidence/validator.log')
          report={'baseline':'glibc 2.17','target':'arm64 cp311','source_lock_sha256':hashlib.sha256(Path('backend/uv.lock').read_bytes()).hexdigest(),'individual':rows,'closure_exit':code,'validator_exit':validator,'release_ready':False}
          Path('evidence/intake.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kylin-legacy-arm64-wheel-intake
          path: evidence
          if-no-files-found: error
          retention-days: 14
  donor-inventory:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify historical donor and compare exact library metadata and ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence donor
          gh release download v1.4.5-rc.6 --repo "$GITHUB_REPOSITORY" --pattern 'PartyOps_1.4.5-rc.6_linux_arm64_kylin-full-20261016.deb' --dir donor
          printf '%s  %s\n' 17d0e3a3acf060d3c65299c012078435bacc0da3f1f0a909fe3cc997cbbee69c donor/*.deb | sha256sum -c -
          dpkg-deb -x donor/*.deb old
          python - <<'PY'
          import json,email,re,subprocess,hashlib
          from pathlib import Path
          root=Path('old/opt/partyops/_internal')
          expected={'argon2-cffi-bindings':'25.1.0','cryptography':'50.0.0','lxml':'6.1.1','onnxruntime':'1.22.1','pillow':'13.0.0','pysqlite3':'0.5.4'}
          metadata=[]
          for p in root.rglob('METADATA'):
              if not p.parent.name.endswith('.dist-info'): continue
              m=email.message_from_bytes(p.read_bytes())
              name=(m.get('Name') or '').lower().replace('_','-')
              if name in expected: metadata.append({'name':name,'version':m.get('Version'),'expected':expected[name],'metadata_match':m.get('Version')==expected[name]})
          binaries=[]
          for p in root.rglob('*'):
              if p.is_symlink() or not p.is_file(): continue
              rel=str(p.relative_to(root))
              if not any(x in rel for x in ('_argon2','cryptography/','lxml/','onnxruntime/','pillow.libs/','PIL/','pysqlite3/')): continue
              with p.open('rb') as f:
                  if f.read(4)!=b'\x7fELF': continue
              out=subprocess.check_output(['readelf','--version-info','--wide',str(p)],text=True,errors='replace').partition('Version needs section')[2]
              v=sorted(set(re.findall(r'Name: GLIBC_(\d+(?:\.\d+)+)\b',out)),key=lambda x:tuple(map(int,x.split('.'))))
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              binaries.append({'path':rel,'max_glibc':v[-1] if v else None,'sha256':digest})
          report={'metadata':metadata,'elf':binaries,'scope':'inventory only; matching version alone does not authorize substitution','release_ready':False}
          Path('evidence/donor.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kylin-legacy-arm64-donor-inventory
          path: evidence
          if-no-files-found: error
          retention-days: 14
  sqlite-rebuild:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build same SQLite 3.51.3 and pysqlite3 0.5.4 against native glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sqlite input
          # Reuse source hashes recorded by the original ARM64 freeze.
          gh run download 45782211205 --repo "$GITHUB_REPOSITORY" --name 'partyops-uos-arm64-APP-FREEZE-RECEIPT-2cfe443d5dea292260baf17d116c2a1451ee7032' --dir input/receipt
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o input/sqlite-amalgamation-3510300.zip https://www.sqlite.org/2026/sqlite-amalgamation-3510300.zip
          python scripts/download-pypi-sdist.py 'pysqlite3==0.5.4' input
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in Path('input/receipt').rglob('*.json')]
          receipt=next(r for r in reports if 'source_input_sha256' in r)
          for name in ['sqlite-amalgamation-3510300.zip','pysqlite3-0.5.4.tar.gz']:
              assert hashlib.sha256((Path('input')/name).read_bytes()).hexdigest()==receipt['source_input_sha256'][name],name
          PY
          docker pull quay.io/pypa/manylinux2014_aarch64:latest
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' quay.io/pypa/manylinux2014_aarch64:latest)"
          printf '%s\n' "$image" > evidence/sqlite/builder-image.txt
          docker run --rm --network none -v "$PWD/input:/input:ro" -v "$PWD/evidence/sqlite:/out" "$image" /bin/bash -c '
            set -euo pipefail
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
            PY=/opt/python/cp311-cp311/bin/python
            mkdir -p /tmp/src
            cd /tmp/src
            tar -xzf /input/pysqlite3-0.5.4.tar.gz
            cd pysqlite3-0.5.4
            unzip -p /input/sqlite-amalgamation-3510300.zip sqlite-amalgamation-3510300/sqlite3.c > sqlite3.c
            unzip -p /input/sqlite-amalgamation-3510300.zip sqlite-amalgamation-3510300/sqlite3.h > sqlite3.h
            export CFLAGS="-O3 -g0 -fPIC"
            "$PY" setup.py build_static bdist_wheel
            auditwheel repair --plat manylinux2014_aarch64 -w /out dist/*.whl
            "$PY" -m pip install --no-index /out/*.whl
            "$PY" -c "import pysqlite3 as s; assert s.sqlite_version == \"3.51.3\"; db=s.connect(\":memory:\"); db.execute(\"create virtual table test using fts5(body)\"); print(s.sqlite_version, \"FTS5 PASS\")"
            sha256sum /out/*.whl > /out/wheel.sha256
          ' 2>&1 | tee evidence/sqlite/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kylin-legacy-arm64-sqlite-wheel
          path: evidence/sqlite
          if-no-files-found: error
          retention-days: 14
